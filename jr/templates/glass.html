<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Glass Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #1C1C1E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Onest", -apple-system, "SF Pro Display", sans-serif;
    color: #fff;
    min-height: 100vh;
    background:
      radial-gradient(1200px 800px at 10% 10%, #FF9A9E 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 20%, #A18CD1 0%, transparent 55%),
      radial-gradient(900px 800px at 50% 100%, #FAD0C4 0%, transparent 50%),
      radial-gradient(800px 600px at 80% 80%, #FBC2EB 0%, transparent 50%),
      linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Loading + error */
  .state {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .state.error { color: #FFD60A; }
  .state .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hero */
  .hero {
    max-width: 1240px;
    margin: 0 auto;
    padding: 56px 32px 32px;
  }
  .profile-card {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 32px;
    padding: 32px;
    display: grid;
    grid-template-columns: 180px 1fr auto;
    gap: 32px;
    align-items: center;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.15),
      inset 0 1px 0 rgba(255,255,255,0.4);
    animation: fadeUp 600ms cubic-bezier(0.22,1,0.36,1) both;
  }
  .profile-photo {
    width: 180px;
    aspect-ratio: 1/1;
    border-radius: 40px;
    overflow: hidden;
    background: rgba(255,255,255,0.2);
    box-shadow: 0 12px 30px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.3);
    position: relative;
  }
  .profile-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 600ms cubic-bezier(0.22,1,0.36,1);
  }
  .profile-photo:hover img { transform: scale(1.08); }
  .profile-photo .initials {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 4rem;
    letter-spacing: -0.04em;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .profile-info { min-width: 0; }
  .profile-info .greeting {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .profile-info .name {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.025em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    word-wrap: break-word;
  }
  .profile-info .username {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    margin-top: 10px;
    font-weight: 500;
  }
  .profile-stats {
    display: flex;
    gap: 16px;
  }
  .stat-pill {
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 16px 20px;
    text-align: center;
    min-width: 90px;
  }
  .stat-pill .num {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat-pill .lbl {
    font-size: 10px;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 6px;
    font-weight: 600;
  }

  /* Section */
  .section {
    max-width: 1240px;
    margin: 0 auto;
    padding: 16px 32px 80px;
  }
  .section-h {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 24px 4px 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .section-h h2 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .section-h .meta {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* Activity sparkline */
  .activity-strip {
    display: flex;
    gap: 24px;
    align-items: end;
    padding: 14px 16px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    margin: 8px 4px 16px;
  }
  .spark-wrap { flex: 1; }
  .spark-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .spark-label strong { color: #fff; font-weight: 600; }
  .spark-bars { display: flex; gap: 2px; align-items: end; height: 36px; }
  .spark-bar {
    flex: 1; min-width: 2px;
    background: rgba(255,255,255,0.85);
    transition: opacity 200ms ease;
    border-radius: 1px;
  }
  .spark-bar:hover { background: #FFD60A; }
  .spark-bar.zero { opacity: 0.15; height: 1px !important; }
  .spark-tenure-lbl {
    font-size: 9px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-bottom: 6px;
  }
  .spark-tenure {
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  /* Worked With (glass) */
  .worked-with {
    margin: 24px 4px 0;
    padding: 16px 20px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
  }
  .ww-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
  }
  .ww-list { display: flex; flex-wrap: wrap; gap: 14px; }
  .ww-item {
    font-size: 13px;
    font-weight: 500;
    color: #fff;
  }
  .ww-item .count { font-size: 10px; color: rgba(255,255,255,0.55); margin-left: 4px; }

  /* Cell tenure */
  .cell-tenure {
    font-size: 9px;
    color: rgba(255,255,255,0.55);
    margin-top: 1px;
    font-family: "Onest";
    letter-spacing: 0.04em;
  }

  /* Glass filters */
  .filters {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 4px 24px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
  }
  .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-row .lbl {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    min-width: 75px;
  }
  .filter-row .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    color: #fff;
    padding: 5px 11px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 150ms ease;
    font-family: "Onest";
    border-radius: 12px;
  }
  .chip-btn:hover { background: rgba(255,255,255,0.22); }
  .chip-btn.active { background: #fff; color: var(--ink); border-color: #fff; }
  .chip-btn .ct { margin-left: 4px; opacity: 0.6; font-size: 9px; }

  /* iOS Grid */
  .ios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 28px 16px;
    padding: 24px 8px;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    cursor: pointer;
    animation: cellIn 500ms cubic-bezier(0.22,1,0.36,1) calc(var(--cell-delay,0ms) + 100ms) both;
  }

  /* ━━━━━━━━━━━━━━━ APPLE LIQUID GLASS ICONS ━━━━━━━━━━━━━━━
     Multi-layer composition matching iOS 26 / visionOS Liquid Glass material:
       1. icon-bg     — base color gradient (per-bucket)
       2. icon-refract — backdrop-filter blur for refraction layer
       3. icon-glass  — top diffuse light (linear gradient)
       4. icon-spec   — dynamic specular highlight (mouse-tracked via --spec-x/y)
       5. icon-content — wordmark/logo
       6. icon-shine  — diagonal grazing-light streak
       7. ::before/::after — edge contour + bottom shadow
     Apple uses ~22% border-radius for continuous-corner squircle approximation. */
  .icon {
    width: 88px;
    height: 88px;
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    transition: transform 280ms cubic-bezier(0.22,1,0.36,1), box-shadow 320ms ease;
    /* Multi-layer shadow for Apple-grade depth */
    box-shadow:
      /* close shadow */
      0 1px 2px rgba(0,0,0,0.12),
      /* mid shadow */
      0 6px 12px rgba(0,0,0,0.12),
      /* drop shadow */
      0 16px 32px rgba(0,0,0,0.18),
      /* top edge highlight (specular catch on glass top) */
      inset 0 1px 0 rgba(255,255,255,0.5),
      /* bottom edge shadow (glass bottom curve) */
      inset 0 -1px 0 rgba(0,0,0,0.12),
      /* inner border refraction */
      inset 0 0 0 0.5px rgba(255,255,255,0.18);
    --spec-x: 30%;
    --spec-y: 25%;
  }
  /* Edge contour — refractive border picking up light from above */
  .icon::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(155deg,
      rgba(255,255,255,0.7) 0%,
      rgba(255,255,255,0.2) 25%,
      rgba(255,255,255,0) 55%,
      rgba(0,0,0,0.05) 80%,
      rgba(0,0,0,0.18) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    z-index: 5;
    opacity: 0.9;
  }
  /* Subtle bottom dark gradient (refraction caustic) */
  .icon::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(0deg, rgba(0,0,0,0.18) 0%, transparent 100%);
    pointer-events: none;
    z-index: 1;
    border-bottom-left-radius: inherit;
    border-bottom-right-radius: inherit;
  }

  .cell:hover .icon {
    transform: scale(1.1) translateY(-4px);
    box-shadow:
      0 1px 2px rgba(0,0,0,0.14),
      0 10px 20px rgba(0,0,0,0.16),
      0 24px 50px rgba(0,0,0,0.24),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -1px 0 rgba(0,0,0,0.14),
      inset 0 0 0 0.5px rgba(255,255,255,0.25);
  }
  .cell:active .icon { transform: scale(0.95); transition-duration: 120ms; }

  /* Layer 1: Base gradient color */
  .icon-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
    z-index: 0;
  }

  /* Layer 2: Top diffuse light — softer than before, more authentic */
  .icon-glass {
    position: absolute;
    inset: 0;
    background:
      /* top diffuse light */
      linear-gradient(180deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0) 60%),
      /* side highlight */
      linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 30%);
    pointer-events: none;
    z-index: 2;
  }

  /* Layer 3: Dynamic specular highlight — tracked by mouse */
  .icon-spec {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--spec-x) var(--spec-y),
      rgba(255,255,255,0.55) 0%,
      rgba(255,255,255,0.2) 14%,
      transparent 35%);
    pointer-events: none;
    z-index: 3;
    mix-blend-mode: screen;
    transition: background-position 200ms ease;
    opacity: 0.85;
  }

  /* Layer 4: Diagonal grazing-light streak — gives Apple's "wet" feel */
  .icon-shine {
    position: absolute;
    top: -60%; left: -30%;
    width: 80%; height: 200%;
    background: linear-gradient(135deg,
      transparent 40%,
      rgba(255,255,255,0.4) 50%,
      transparent 60%);
    transform: translateX(-100%) rotate(20deg);
    pointer-events: none;
    transition: transform 800ms cubic-bezier(0.22,1,0.36,1);
    z-index: 4;
    opacity: 0.7;
    mix-blend-mode: overlay;
  }
  .cell:hover .icon-shine {
    transform: translateX(150%) rotate(20deg);
  }

  .icon-content {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3), 0 0 8px rgba(0,0,0,0.15);
    padding: 6px;
    z-index: 6;
  }
  .icon-content.has-logo { padding: 16px; }
  .icon-content.has-logo img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    filter: brightness(1.05) drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }
  .wordmark {
    font-family: "Onest";
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    text-align: center;
    color: #fff;
    /* Never break mid-word */
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: normal;
    hyphens: none;
    max-width: 100%;
    overflow: hidden;
  }

  .cell-label {
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    text-align: center;
    line-height: 1.2;
    max-width: 110px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .cell-badge {
    position: absolute;
    top: -6px;
    right: 50%;
    transform: translateX(58px);
    background: #FF3B30;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 22px;
    height: 22px;
    border-radius: 11px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2), 0 0 0 2px rgba(255,255,255,0.3);
    font-family: "Onest";
    letter-spacing: -0.01em;
  }

  /* Popover — fixed center, modal style with strong backdrop */
  .cell-popover {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% + 12px));
    width: clamp(380px, 56vw, 560px);
    min-height: 220px;
    background: rgba(20,20,22,0.96);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 24px 28px;
    color: #fff;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    text-align: left;
  }
  .cell.show-popover .cell-popover {
    opacity: 1;
    transform: translate(-50%, -50%);
    pointer-events: auto;
  }
  /* Backdrop — strong dim + heavy blur so cells fully recede */
  .pop-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px) saturate(120%);
    -webkit-backdrop-filter: blur(12px) saturate(120%);
    z-index: 900;
    opacity: 0;
    pointer-events: none;
    transition: opacity 240ms ease, backdrop-filter 240ms ease;
  }
  body.pop-active .pop-backdrop { opacity: 1; }

  /* CRITICAL: opacity animation on .cell creates a stacking context,
     trapping the fixed-position popover. Lift the active cell above backdrop. */
  .cell.show-popover { z-index: 1100 !important; }
  .pop-h { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .pop-sub { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 10px; letter-spacing: 0.04em; }
  .pop-list { list-style: none; }
  .pop-list li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .pop-list li:last-child { border-bottom: 0; }
  .pop-list li.muted { color: rgba(255,255,255,0.4); }
  .proj-row { display: flex; gap: 10px; align-items: baseline; font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.92); }
  .proj-count { font-size: 10px; font-weight: 700; color: #FFD60A; min-width: 22px; text-align: right; font-family: "Onest"; }
  a.proj-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; color: inherit; text-decoration: none; transition: color 150ms ease; }
  a.proj-title:hover { color: #93C5FD; text-decoration: underline; }
  .proj-meta { margin-top: 3px; margin-left: 32px; font-size: 10px; color: rgba(255,255,255,0.5); display: flex; gap: 8px; flex-wrap: wrap; letter-spacing: 0.02em; }
  .proj-meta .stat-done { color: rgba(110,231,183,0.85); }
  .proj-meta .stat-wip  { color: rgba(147,197,253,0.85); }
  .proj-meta .stat-rev  { color: rgba(252,211,77,0.85); }
  .proj-meta .stat-hold { color: rgba(252,165,165,0.85); }
  .proj-meta .stat-open { color: rgba(255,255,255,0.45); }
  .proj-date { color: rgba(255,255,255,0.4); margin-left: auto; }

  .footer {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px 200px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .footer a { color: rgba(255,214,10,0.95); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Cells: opacity-only — transform on .cell breaks `position: fixed` popover anchoring */
  @keyframes cellIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 768px) {
    .hero { padding: 32px 16px 16px; }
    .section { padding: 12px 16px 60px; }
    .profile-card { grid-template-columns: 1fr; gap: 20px; padding: 24px; border-radius: 24px; }
    .profile-photo { width: 140px; }
    .profile-info .name { font-size: 1.8rem; }
    .profile-stats { justify-content: flex-start; flex-wrap: wrap; gap: 10px; }
    .stat-pill { min-width: 0; flex: 1; padding: 12px 14px; }
    .stat-pill .num { font-size: 1.4rem; }
    .stat-pill .lbl { font-size: 9px; }

    /* Activity strip — stack vertically */
    .activity-strip { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px 14px; }
    .activity-strip > div:last-child { display: flex; justify-content: space-between; align-items: end; }
    .spark-bars { height: 28px; }

    /* Filter chips — bigger touch targets, smaller layout */
    .filters { padding: 12px 14px; }
    .filter-row { gap: 8px; }
    .filter-row .lbl { min-width: 60px; font-size: 9px; }
    .chip-btn { padding: 8px 12px; font-size: 12px; min-height: 36px; }
    .chip-btn .ct { font-size: 9px; }

    /* iOS grid — denser */
    .ios-grid { grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 22px 10px; padding: 16px 4px; }
    .icon { width: 72px; height: 72px; border-radius: 16px; }
    .cell-badge {
      top: -4px;
      right: 50%;
      transform: translateX(44px);
      min-width: 20px; height: 20px;
      font-size: 10px;
    }
    .cell-label { font-size: 11px; max-width: 90px; }

    /* Popover — fit small viewports, no overflow */
    .cell-popover {
      width: calc(100vw - 32px);
      min-height: 0;
      max-height: 80vh;
      padding: 18px 20px;
      border-radius: 16px;
      overflow-y: auto;
    }
    .pop-h { font-size: 14px; }
    .pop-sub { font-size: 10px; }
    .pop-list { font-size: 11px; }

    /* Worked with — stack */
    .worked-with { padding: 14px 16px; gap: 12px; }
    .ww-list { gap: 10px; }
    .ww-item { font-size: 12px; }

    .footer { padding: 0 16px 60px; }
  }
  @media (max-width: 380px) {
    .ios-grid { grid-template-columns: repeat(3, 1fr); gap: 18px 8px; }
    .icon { width: 64px; height: 64px; border-radius: 14px; }
    .cell-badge { transform: translateX(36px); min-width: 18px; height: 18px; font-size: 9px; }
    .cell-label { font-size: 10px; max-width: 80px; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="state" id="state-loading">
      <div class="spinner"></div>
      <div>Loading portfolio…</div>
    </div>
  </div>

<script>
const IOS_GRADIENTS = [
  ['#FF6B6B','#FF8E53'],['#4FACFE','#00F2FE'],['#43E97B','#38F9D7'],['#FA709A','#FEE140'],
  ['#667EEA','#764BA2'],['#F093FB','#F5576C'],['#30CFD0','#330867'],['#A8EDEA','#FED6E3'],
  ['#FF9A9E','#FECFEF'],['#FBC2EB','#A6C1EE'],['#FDBB2D','#22C1C3'],['#FF512F','#DD2476'],
  ['#56CCF2','#2F80ED'],['#11998E','#38EF7D'],['#EE0979','#FF6A00'],['#8E2DE2','#4A00E0'],
  ['#1FA2FF','#A6FFCB'],['#FF0099','#493240'],['#FC466B','#3F5EFB'],['#FFAFBD','#FFC3A0'],
];

(async function() {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  const TOKEN_RE = /^[a-f0-9]{12}$/;
  const app = document.getElementById('app');

  if (!token || !TOKEN_RE.test(token)) {
    app.innerHTML = '<div class="state error">Invalid or missing token.</div>';
    return;
  }
  // Mask URL so token isn't trivially copied/edited from the address bar
  try { history.replaceState(null, '', './glass.html'); } catch (_) {}

  let data;
  try {
    const r = await fetch('../data/' + token + '.json');
    if (!r.ok) throw new Error('Profile not found');
    data = await r.json();
  } catch (e) {
    app.innerHTML = '<div class="state error">Failed to load profile.</div>';
    return;
  }
  document.title = data.user.displayName + ' — Glass Portfolio';
  app.innerHTML = render(data);
  initFilters();
})();

function initFilters() {
  const cells = Array.from(document.querySelectorAll('.cell'));

  // Apple Liquid Glass — track mouse position to move specular highlight
  cells.forEach(cell => {
    const icon = cell.querySelector('.icon');
    if (!icon) return;
    icon.addEventListener('mousemove', e => {
      const rect = icon.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      icon.style.setProperty('--spec-x', x + '%');
      icon.style.setProperty('--spec-y', y + '%');
    });
    icon.addEventListener('mouseleave', () => {
      icon.style.setProperty('--spec-x', '30%');
      icon.style.setProperty('--spec-y', '25%');
    });
  });

  // Inject backdrop once
  if (!document.querySelector('.pop-backdrop')) {
    const bd = document.createElement('div');
    bd.className = 'pop-backdrop';
    document.body.appendChild(bd);
  }

  // Popover: hover-preview on desktop, tap-toggle (sticky) on touch.
  // Both bind unconditionally — tap sets `body.tap-mode` so hover is ignored after first tap.
  function closeAll() {
    cells.forEach(c => c.classList.remove('show-popover'));
    document.body.classList.remove('pop-active');
  }
  cells.forEach(cell => {
    // First touch ANYWHERE switches to tap-mode (before synthesized mouseenter fires)
    cell.addEventListener('touchstart', () => document.body.classList.add('tap-mode'), { passive: true });
    cell.addEventListener('mouseenter', () => {
      if (document.body.classList.contains('tap-mode')) return;
      closeAll();
      cell.classList.add('show-popover');
      document.body.classList.add('pop-active');
    });
    cell.addEventListener('mouseleave', () => {
      if (document.body.classList.contains('tap-mode')) return;
      closeAll();
    });
    cell.addEventListener('click', e => {
      if (e.target.closest('a.proj-title')) return;
      document.body.classList.add('tap-mode');
      const willOpen = !cell.classList.contains('show-popover');
      closeAll();
      if (willOpen) {
        cell.classList.add('show-popover');
        document.body.classList.add('pop-active');
      }
    });
  });
  // Outside tap closes
  document.addEventListener('click', e => {
    if (e.target.closest('.cell') || e.target.closest('.cell-popover')) return;
    closeAll();
    document.body.classList.remove('tap-mode');
  });
  // Escape closes
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeAll(); document.body.classList.remove('tap-mode'); }
  });

  const yearFilter = document.getElementById('year-filter');
  const wtFilter = document.getElementById('wt-filter');
  let activeYear = 'all', activeWt = 'all';

  function apply() {
    cells.forEach(t => {
      const yrs = (t.dataset.years || '').split(' ');
      const wts = (t.dataset.wts || '').split(' ');
      const yrOk = activeYear === 'all' || yrs.includes(activeYear);
      const wtOk = activeWt === 'all' || wts.includes(activeWt);
      t.style.display = (yrOk && wtOk) ? '' : 'none';
    });
  }

  function bind(container, onPick) {
    if (!container) return;
    container.addEventListener('click', e => {
      const btn = e.target.closest('.chip-btn');
      if (!btn) return;
      container.querySelectorAll('.chip-btn').forEach(c => c.classList.toggle('active', c === btn));
      onPick(btn);
    });
  }
  bind(yearFilter, b => { activeYear = b.dataset.year; apply(); });
  bind(wtFilter, b => { activeWt = b.dataset.wt; apply(); });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function gradientForBucket(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h << 5) - h + id.charCodeAt(i);
  return IOS_GRADIENTS[Math.abs(h) % IOS_GRADIENTS.length];
}

function fontSizeForGlass(text) {
  // Tile content area ~76 (88 - 12 padding). Inter@800 char ≈ 0.55em.
  const tokens = String(text || '').trim().split(/\s+/);
  const longestToken = tokens.reduce((a, t) => Math.max(a, t.length), 0);
  if (tokens.length === 1) {
    const len = longestToken;
    if (len <= 3) return '2.4rem';
    if (len <= 4) return '1.85rem';
    if (len <= 5) return '1.45rem';
    if (len <= 6) return '1.2rem';
    if (len <= 7) return '1rem';
    if (len <= 8) return '0.88rem';
    if (len <= 10) return '0.72rem';
    if (len <= 12) return '0.62rem';
    return '0.55rem';
  } else {
    if (longestToken <= 3) return '1.7rem';
    if (longestToken <= 4) return '1.4rem';
    if (longestToken <= 5) return '1.15rem';
    if (longestToken <= 6) return '0.95rem';
    if (longestToken <= 8) return '0.78rem';
    return '0.65rem';
  }
}

function relDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const days = Math.round((Date.now() - d.getTime()) / 86400000);
  if (days < 1) return 'today';
  if (days < 7) return days + 'd ago';
  if (days < 30) return Math.round(days/7) + 'w ago';
  if (days < 365) return Math.round(days/30) + 'mo ago';
  return Math.round(days/365) + 'y ago';
}
function statusBucket(name) {
  const v = (name || '').toLowerCase();
  if (/done|closed|resolved/.test(v)) return 'done';
  if (/progress|implement/.test(v)) return 'wip';
  if (/review/.test(v)) return 'rev';
  if (/hold/.test(v)) return 'hold';
  return 'open';
}
function statusBreakdown(counts) {
  if (!counts) return '';
  const agg = { done:0, wip:0, rev:0, hold:0, open:0 };
  for (const [name, n] of Object.entries(counts)) agg[statusBucket(name)] += n;
  const labels = { done: 'done', wip: 'wip', rev: 'review', hold: 'hold', open: 'open' };
  const parts = [];
  for (const k of ['done','wip','rev','hold','open']) {
    if (agg[k] > 0) parts.push('<span class="stat-' + k + '">' + agg[k] + ' ' + labels[k] + '</span>');
  }
  return parts.join(' · ');
}

function render(data) {
  const u = data.user;
  const tiles = data.buckets;
  const totalIssues = data.totalIssues;
  const totalDone = tiles.reduce((s, b) => s + (b.doneCount || 0), 0);
  const jiraBase = data.jiraBaseUrl || '';

  const portrait = u.portraitDataUrl
    ? '<img src="' + u.portraitDataUrl + '" alt="' + escapeHtml(u.displayName) + '"/>'
    : '<div class="initials">' + escapeHtml(u.initials || '?') + '</div>';

  const maxDelay = 800;
  const stepDelay = Math.min(30, maxDelay / Math.max(tiles.length, 1));

  const tileHtml = tiles.map((b, idx) => {
    const wordmark = b.wordmark || b.id;
    const [c1, c2] = gradientForBucket(b.id);
    const iconHtml = b.logoDataUrl
      ? '<img src="' + b.logoDataUrl + '" alt="' + escapeHtml(b.id) + '"/>'
      : '<span class="wordmark" style="font-size:' + fontSizeForGlass(wordmark) + '">' + escapeHtml(wordmark) + '</span>';
    const topProjs = (b.topProjects || []).slice(0, 5);
    const projList = topProjs.map(p => {
      const titleText = escapeHtml((p.title || p.key).slice(0, 50));
      const url = jiraBase ? jiraBase + '/browse/' + p.key : '#';
      const breakdown = statusBreakdown(p.statusCounts);
      const date = p.latestUpdate ? '<span class="proj-date">' + relDate(p.latestUpdate) + '</span>' : '';
      return '<li>' +
        '<div class="proj-row"><span class="proj-count">' + p.count + '</span>' +
        '<a class="proj-title" href="' + url + '" target="_blank" rel="noopener" title="' + escapeHtml(p.title || p.key) + '">' + titleText + '</a></div>' +
        (breakdown || date ? '<div class="proj-meta">' + breakdown + date + '</div>' : '') +
        '</li>';
    }).join('');
    const delay = Math.round(idx * stepDelay);
    const updatedNote = b.latestUpdate ? ' · last ' + relDate(b.latestUpdate) : '';
    const tileYears = Object.keys(b.years || {}).join(' ');
    const tileWts = Object.keys(b.workTypes || {}).join(' ');
    const earliestY = b.earliestCreated ? b.earliestCreated.slice(0,4) : null;
    const latestY = b.latestUpdate ? b.latestUpdate.slice(0,4) : null;
    const tenure = earliestY && latestY ? (earliestY === latestY ? earliestY : earliestY + '–' + latestY.slice(2)) : '';
    return '' +
      '<div class="cell" data-years="' + tileYears + '" data-wts="' + tileWts + '" style="--c1:' + c1 + ';--c2:' + c2 + ';--cell-delay:' + delay + 'ms">' +
        '<div class="icon">' +
          '<div class="icon-bg"></div>' +
          '<div class="icon-glass"></div>' +
          '<div class="icon-spec"></div>' +
          '<div class="icon-shine"></div>' +
          '<div class="icon-content ' + (b.logoDataUrl ? 'has-logo' : 'is-wordmark') + '">' + iconHtml + '</div>' +
        '</div>' +
        '<div class="cell-label">' + escapeHtml(b.label) + (tenure ? '<div class="cell-tenure">' + tenure + '</div>' : '') + '</div>' +
        '<div class="cell-badge">' + b.ticketCount + '</div>' +
        '<div class="cell-popover">' +
          '<div class="pop-h">' + escapeHtml(b.label) + '</div>' +
          '<div class="pop-sub">' + b.ticketCount + ' tickets · ' + (b.doneCount || 0) + ' done' + updatedNote + (tenure ? ' · active ' + tenure : '') + '</div>' +
          '<ul class="pop-list">' + (projList || '<li class="muted">—</li>') + '</ul>' +
        '</div>' +
      '</div>';
  }).join('');

  // Aggregate filter options
  const allYears = new Set();
  const allWorkTypes = {};
  tiles.forEach(b => {
    Object.keys(b.years || {}).forEach(y => allYears.add(y));
    Object.entries(b.workTypes || {}).forEach(([k,v]) => { if (k !== 'other') allWorkTypes[k] = (allWorkTypes[k]||0) + v; });
  });
  const yearsSorted = [...allYears].sort((a,b) => b.localeCompare(a));
  const wtsSorted = Object.entries(allWorkTypes).sort((a,b) => b[1]-a[1]);
  const yearChips = '<button class="chip-btn active" data-year="all">All</button>' +
    yearsSorted.map(y => '<button class="chip-btn" data-year="' + y + '">' + y + '</button>').join('');
  const wtChips = '<button class="chip-btn active" data-wt="all">All</button>' +
    wtsSorted.map(([k,v]) => '<button class="chip-btn" data-wt="' + k + '">' + (k[0].toUpperCase()+k.slice(1)) + '<span class="ct">' + v + '</span></button>').join('');

  // Sparkline
  const monthly = data.monthlyActivity || {};
  const months = Object.keys(monthly).sort();
  let sparklineHtml = '';
  if (months.length) {
    const minMonth = months[0], maxMonth = months[months.length - 1];
    const allMonths = [];
    let cur = new Date(minMonth + '-01');
    const end = new Date(maxMonth + '-01');
    while (cur <= end) {
      const ym = cur.toISOString().slice(0,7);
      allMonths.push({ ym, count: monthly[ym] || 0 });
      cur.setMonth(cur.getMonth() + 1);
    }
    const maxCount = Math.max(...allMonths.map(m => m.count), 1);
    const fmtMonth = ym => { const [y,m] = ym.split('-'); return new Date(+y, +m-1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }); };
    sparklineHtml = '' +
      '<div class="activity-strip">' +
        '<div class="spark-wrap">' +
          '<div class="spark-label"><strong>Monthly activity</strong><span>' + allMonths.length + ' months</span></div>' +
          '<div class="spark-bars">' +
            allMonths.map(m => {
              const h = m.count ? Math.max(2, Math.round((m.count / maxCount) * 36)) : 1;
              const cls = m.count ? '' : ' zero';
              return '<div class="spark-bar' + cls + '" style="height:' + h + 'px" title="' + m.ym + ': ' + m.count + ' tickets"></div>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="spark-tenure-lbl">Active</div>' +
          '<div class="spark-tenure">' + fmtMonth(minMonth) + ' → ' + fmtMonth(maxMonth) + '</div>' +
        '</div>' +
      '</div>';
  }

  // Worked with
  const reporters = (data.topReporters || []).slice(0, 5);
  let workedWithHtml = '';
  if (reporters.length) {
    const items = reporters.map(r => {
      const shortName = r.name.replace(/\s*\([^)]+\)\s*/, '').trim();
      return '<span class="ww-item">' + escapeHtml(shortName) + '<span class="count">' + r.count + '</span></span>';
    }).join('');
    workedWithHtml = '<div class="worked-with"><span class="ww-label">Worked with</span><div class="ww-list">' + items + '</div></div>';
  }

  return '' +
    '<header class="hero">' +
      '<div class="profile-card">' +
        '<div class="profile-photo">' + portrait + '</div>' +
        '<div class="profile-info">' +
          '<div class="greeting">Designer · ' + escapeHtml(data.project) + '</div>' +
          '<h1 class="name">' + escapeHtml(u.displayName) + '</h1>' +
          '<div class="username">@' + escapeHtml(u.name) + '</div>' +
        '</div>' +
        '<div class="profile-stats">' +
          '<div class="stat-pill"><div class="num">' + tiles.length + '</div><div class="lbl">Brands</div></div>' +
          '<div class="stat-pill"><div class="num">' + totalIssues + '</div><div class="lbl">Tickets</div></div>' +
          '<div class="stat-pill"><div class="num">' + totalDone + '</div><div class="lbl">Done</div></div>' +
        '</div>' +
      '</div>' +
    '</header>' +
    '<main class="section">' +
      '<div class="section-h">' +
        '<h2>Apps</h2>' +
        '<div class="meta">' + tiles.length + ' brands · hover for detail</div>' +
      '</div>' +
      sparklineHtml +
      '<div class="filters">' +
        '<div class="filter-row"><span class="lbl">Year</span><div class="chips" id="year-filter">' + yearChips + '</div></div>' +
        '<div class="filter-row"><span class="lbl">Work type</span><div class="chips" id="wt-filter">' + wtChips + '</div></div>' +
      '</div>' +
      '<div class="ios-grid">' + tileHtml + '</div>' +
      workedWithHtml +
    '</main>' +
    '';
}
</script>
</body>
</html>
