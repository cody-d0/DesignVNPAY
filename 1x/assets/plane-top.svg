<svg viewBox="0 0 445.268 112" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .ellipse-pulse {
    transform-box: fill-box;
    transform-origin: center;
    will-change: transform, opacity;
  }

  .ellipse-pulse-outer {
    opacity: .08;
    animation: ellipse-pulse-outer 1.72s cubic-bezier(.22,.61,.36,1) infinite;
  }

  .ellipse-pulse-inner {
    opacity: .16;
    animation: ellipse-pulse-inner 1.72s cubic-bezier(.22,.61,.36,1) .08s infinite;
  }

  @keyframes ellipse-pulse-outer {
    0%, 100% {
      opacity: .07;
      transform: scale(.965);
    }
    46% {
      opacity: .13;
      transform: scale(1);
    }
    72% {
      opacity: .09;
      transform: scale(.985);
    }
  }

  @keyframes ellipse-pulse-inner {
    0%, 100% {
      opacity: .14;
      transform: scale(.975);
    }
    46% {
      opacity: .22;
      transform: scale(1);
    }
    72% {
      opacity: .14;
      transform: scale(.99);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ellipse-pulse {
      animation: none;
      transform: scale(1);
      will-change: auto;
    }

    .ellipse-pulse-outer {
      opacity: .08;
    }

    .ellipse-pulse-inner {
      opacity: .16;
    }
  }
</style>
