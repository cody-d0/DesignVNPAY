<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-opBank KHCN · UX Sitemap Tree v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════ */
/* Design Tokens                                   */
/* ══════════════════════════════════════════════ */
:root {
  --bg: #f8f9fc;
  --bg-card: #ffffff;
  --bg-hover: #f0f4ff;
  --bg-header: rgba(255,255,255,0.85);

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;

  --accent-blue: #3b82f6;
  --accent-purple: #7c3aed;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-amber: #f59e0b;
  --accent-red: #ef4444;

  --cat-core: #3b82f6;
  --cat-product: #7c3aed;
  --cat-support: #06b6d4;
  --cat-onboard: #10b981;

  --border: #e2e8f0;
  --border-tree: #cbd5e1;

  --radius: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);

  --font: 'Inter', -apple-system, system-ui, sans-serif;
  --transition: 200ms ease;
}

/* ══════════════════════════════════════════════ */
/* Reset & Base                                    */
/* ══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 14px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

/* Subtle background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(59,130,246,0.04) 0%, transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(124,58,237,0.03) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════════════ */
/* Header                                          */
/* ══════════════════════════════════════════════ */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: white;
  box-shadow: 0 2px 8px rgba(59,130,246,0.25);
}

.header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.header h1 .badge {
  font-weight: 500;
  font-size: 0.7rem;
  color: var(--accent-blue);
  background: rgba(59,130,246,0.08);
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: 8px;
  vertical-align: middle;
}

.header-stats {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(59,130,246,0.06);
  border: 1px solid rgba(59,130,246,0.1);
  font-size: 0.72rem;
  color: var(--text-secondary);
  white-space: nowrap;
}

.stat-pill strong {
  font-weight: 700;
  color: var(--text-primary);
}

/* ══════════════════════════════════════════════ */
/* Toolbar                                         */
/* ══════════════════════════════════════════════ */
.toolbar {
  position: sticky;
  top: 67px;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 32px;
  background: rgba(248,249,252,0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.toolbar .btn {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: white;
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.toolbar .btn:hover {
  background: var(--bg-hover);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.toolbar .btn.active {
  background: rgba(59,130,246,0.08);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.search-box {
  position: relative;
  margin-left: auto;
  width: 240px;
}

.search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--text-muted);
}

.search-box input {
  width: 100%;
  padding: 6px 12px 6px 32px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: white;
  font-family: var(--font);
  font-size: 0.75rem;
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition);
}

.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
}

.legend {
  display: flex;
  gap: 12px;
  margin-left: 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.68rem;
  color: var(--text-muted);
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ══════════════════════════════════════════════ */
/* Canvas                                          */
/* ══════════════════════════════════════════════ */
.canvas {
  position: relative;
  z-index: 1;
  padding: 32px 32px 80px;
  overflow-x: auto;
}

/* ══════════════════════════════════════════════ */
/* Tree Structure (CSS-only lines)                 */
/* ══════════════════════════════════════════════ */

/* Root node */
.tree-root {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.tree-root > .node-content {
  padding: 12px 24px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  color: white;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 1.05rem;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 16px rgba(59,130,246,0.25);
  letter-spacing: -0.01em;
  cursor: default;
}

.tree-root > .node-content .node-icon { font-size: 1.2rem; }

/* Shared tree list */
.tree-children {
  list-style: none;
  padding-left: 32px;
  position: relative;
}

/* Vertical connector from parent */
.tree-children::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 0;
  bottom: 20px;
  width: 1.5px;
  background: var(--border-tree);
}

/* Individual tree item */
.tree-item {
  position: relative;
  padding: 6px 0 6px 28px;
}

/* Horizontal branch connector */
.tree-item::before {
  content: '';
  position: absolute;
  left: -17px;
  top: 22px;
  width: 28px;
  height: 1.5px;
  background: var(--border-tree);
}

/* Branch dot */
.tree-item::after {
  content: '';
  position: absolute;
  left: -21px;
  top: 18px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: white;
  border: 2px solid var(--border-tree);
  z-index: 2;
}

/* Last child — clip vertical line */
.tree-item:last-child > .tree-children::before {
  display: block; /* keep connector for nested children */
}

/* ══════════════════════════════════════════════ */
/* Node Types                                      */
/* ══════════════════════════════════════════════ */

/* Tab node (Level 1) */
.node-tab > .node-content {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--text-primary);
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.node-tab > .node-content:hover {
  border-color: var(--accent-blue);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.node-tab > .node-content .node-icon { font-size: 1.1rem; }

.node-tab > .node-content .node-badge {
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(59,130,246,0.06);
  font-size: 0.65rem;
  font-weight: 500;
  color: var(--text-muted);
}

.node-tab > .node-content .chevron {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  transition: transform var(--transition);
  margin-left: 4px;
}

.node-tab.collapsed > .node-content .chevron {
  transform: rotate(-90deg);
}

.node-tab.collapsed > .tree-children {
  display: none;
}

/* Module node (Level 2) */
.node-module > .node-content {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text-primary);
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
  user-select: none;
  max-width: 360px;
}

.node-module > .node-content:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.node-module > .node-content .mod-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}

.node-module > .node-content .mod-icon.cat-core { background: rgba(59,130,246,0.1); }
.node-module > .node-content .mod-icon.cat-product { background: rgba(124,58,237,0.1); }
.node-module > .node-content .mod-icon.cat-support { background: rgba(6,182,212,0.1); }
.node-module > .node-content .mod-icon.cat-onboard { background: rgba(16,185,129,0.1); }

.node-module > .node-content .mod-label {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.node-module > .node-content .mod-name {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-module > .node-content .mod-desc {
  font-size: 0.65rem;
  font-weight: 400;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 320px;
  opacity: 0.8;
  line-height: 1.3;
}

.node-module > .node-content .mod-meta {
  font-size: 0.65rem;
  font-weight: 400;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
}

.node-module > .node-content .chevron {
  width: 14px;
  height: 14px;
  color: var(--text-muted);
  transition: transform var(--transition);
  flex-shrink: 0;
}

.node-module.collapsed > .node-content .chevron {
  transform: rotate(-90deg);
}

.node-module.collapsed > .tree-children {
  display: none;
}

/* Category left accent border */
.node-module.cat-core > .node-content { border-left: 3px solid var(--cat-core); }
.node-module.cat-product > .node-content { border-left: 3px solid var(--cat-product); }
.node-module.cat-support > .node-content { border-left: 3px solid var(--cat-support); }
.node-module.cat-onboard > .node-content { border-left: 3px solid var(--cat-onboard); }

/* Branch dot color per category */
.node-module.cat-core::after { border-color: var(--cat-core); background: rgba(59,130,246,0.15); }
.node-module.cat-product::after { border-color: var(--cat-product); background: rgba(124,58,237,0.15); }
.node-module.cat-support::after { border-color: var(--cat-support); background: rgba(6,182,212,0.15); }
.node-module.cat-onboard::after { border-color: var(--cat-onboard); background: rgba(16,185,129,0.15); }

/* Sub-function node (Level 3 — leaf) */
.node-sf {
  padding: 3px 0 3px 28px;
}

.node-sf > .node-content {
  display: inline-flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--transition);
  max-width: 480px;
  user-select: none;
}

.node-sf > .node-content:hover {
  background: var(--bg-hover);
}

.node-sf > .node-content .sf-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  opacity: 0.7;
  margin-top: 7px;
}

.node-sf > .node-content .sf-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.node-sf > .node-content .sf-name {
  font-weight: 500;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-sf > .node-content .sf-desc {
  font-size: 0.65rem;
  font-weight: 400;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
  margin-top: 1px;
}

.node-sf > .node-content .sf-badge {
  font-size: 0.6rem;
  padding: 1px 6px;
  border-radius: 8px;
  background: rgba(0,0,0,0.04);
  color: var(--text-muted);
  font-weight: 500;
  flex-shrink: 0;
  margin-top: 2px;
}

.node-sf > .node-content .chevron {
  width: 12px;
  height: 12px;
  color: var(--text-muted);
  transition: transform var(--transition);
  flex-shrink: 0;
  margin-top: 3px;
}

.node-sf.collapsed > .node-content .chevron {
  transform: rotate(-90deg);
}

.node-sf.collapsed > .tree-children {
  display: none;
}

.node-sf::after {
  width: 7px;
  height: 7px;
  border-width: 1.5px;
  top: 16px;
  left: -21px;
}

/* Screen node (Level 4 — leaf) */
.node-screen {
  padding: 2px 0 2px 24px;
}

.node-screen > .node-content {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 5px;
  font-size: 0.68rem;
  font-weight: 400;
  color: var(--text-muted);
  cursor: default;
  transition: background var(--transition);
  max-width: 420px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-screen > .node-content:hover {
  background: rgba(0,0,0,0.03);
  color: var(--text-secondary);
}

.node-screen > .node-content .screen-icon {
  font-size: 0.55rem;
  opacity: 0.5;
  flex-shrink: 0;
}

.node-screen > .node-content .screen-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-screen > .node-content .screen-depth {
  font-size: 0.55rem;
  padding: 0px 5px;
  border-radius: 6px;
  background: rgba(0,0,0,0.03);
  color: var(--text-muted);
  flex-shrink: 0;
  margin-left: auto;
  opacity: 0.7;
}

.node-screen > .node-content .screen-mh {
  font-size: 0.55rem;
  font-family: 'SF Mono', 'Menlo', monospace;
  padding: 0px 4px;
  border-radius: 4px;
  background: rgba(59,130,246,0.08);
  color: #3b82f6;
  flex-shrink: 0;
  opacity: 0.8;
  font-weight: 500;
}

.node-screen > .node-content .screen-ref {
  font-size: 0.52rem;
  font-family: 'SF Mono', 'Menlo', monospace;
  color: var(--text-muted);
  flex-shrink: 0;
  opacity: 0.6;
}

.node-screen::after {
  width: 5px;
  height: 5px;
  border-width: 1px;
  top: 12px;
  left: -21px;
  border-color: var(--border);
  background: var(--bg);
}

/* v5: Actual screen (from domain analysis) */
.node-actual-screen > .node-content {
  border-left: 2px solid rgba(16,185,129,0.5);
  padding-left: 10px;
}
.node-actual-screen > .node-content:hover {
  border-left-color: #10b981;
  background: rgba(16,185,129,0.03);
}
.actual-screen-states {
  font-size: 0.52rem;
  font-family: 'SF Mono', 'Menlo', monospace;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(245,158,11,0.08);
  color: #d97706;
  flex-shrink: 0;
  font-weight: 600;
}
.actual-screen-id {
  font-size: 0.48rem;
  font-family: 'SF Mono', 'Menlo', monospace;
  color: var(--text-muted);
  opacity: 0.5;
  flex-shrink: 0;
}

/* ══════════════════════════════════════════════ */
/* Search highlight                                */
/* ══════════════════════════════════════════════ */
.highlight {
  background: rgba(245,158,11,0.2);
  border-radius: 2px;
  padding: 0 2px;
}

.search-hidden {
  display: none !important;
}

/* ══════════════════════════════════════════════ */
/* Footer                                          */
/* ══════════════════════════════════════════════ */
.footer {
  text-align: center;
  padding: 24px 32px;
  font-size: 0.7rem;
  color: var(--text-muted);
  position: relative;
  z-index: 1;
}

/* ══════════════════════════════════════════════ */
/* Print                                           */
/* ══════════════════════════════════════════════ */
@media print {
  .header, .toolbar { position: static; }
  body::before { display: none; }
  .node-tab.collapsed > .tree-children { display: block !important; }
  .node-module.collapsed > .tree-children { display: block !important; }
  .node-sf.collapsed > .tree-children { display: block !important; }
}

/* ══════════════════════════════════════════════ */
/* Responsive                                      */
/* ══════════════════════════════════════════════ */
@media (max-width: 768px) {
  .header { padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
  .header-stats { display: none; }
  .toolbar { padding: 8px 16px; flex-wrap: wrap; gap: 6px; top: 54px; }
  .legend { display: none; }
  .search-box { width: 100%; margin-left: 0; }
  .canvas { padding: 16px; }
  .tree-children { padding-left: 20px; }
  .tree-item { padding-left: 20px; }
}

/* ══════════════════════════════════════════════ */
/* Lightbox Overlay                                */
/* ══════════════════════════════════════════════ */
.lightbox-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.lightbox-overlay.active {
  display: flex;
  opacity: 1;
}
.lightbox-panel {
  background: #fff;
  border-radius: 12px;
  width: min(90vw, 780px);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 48px rgba(0,0,0,0.16);
  animation: lb-in 0.2s ease;
}
@keyframes lb-in {
  from { transform: translateY(16px) scale(0.97); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.lightbox-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid #e5e7eb;
  gap: 12px;
}
.lightbox-header h3 {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 600;
  color: #111;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lightbox-header .lb-badges {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.lightbox-header .lb-badge {
  font-size: 0.6rem;
  font-family: 'SF Mono', monospace;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(59,130,246,0.1);
  color: #3b82f6;
  font-weight: 500;
}
.lightbox-header .lb-badge.ref {
  background: rgba(139,92,246,0.1);
  color: #7c3aed;
}
.lightbox-close {
  width: 28px;
  height: 28px;
  border: none;
  background: rgba(0,0,0,0.05);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #666;
  flex-shrink: 0;
  transition: background 0.15s;
}
.lightbox-close:hover { background: rgba(0,0,0,0.1); }
.lightbox-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}
.lightbox-body .lb-loading {
  text-align: center;

p có 2 visual variants tùy DV config, không phải user action. Đây là \"server-driven UI\" ở micro-level — popup shape thay đổi dựa trên DV metadata, không cần client logic phức tạp.","core_pattern":"Post-Action Prompt (modal confirmation after task completion) + Config-Driven UI","behavioral":"Moment of completion = highest compliance — user vừa hoàn thành task lớn (thanh toán) → sẵn sàng làm task nhỏ (lưu danh bạ). Zeigarnik effect ngược — brain muốn \"hoàn thiện\" nốt.","differentiation":"Thông thường apps để user tự nhớ lưu danh bạ sau. Molecule này chủ động hỏi tại moment phù hợp nhất — tương tự iOS \"Add to Contacts?\" sau cuộc gọi","state_machine":"2 variants (with/without notice toggle) × 1 popup state = 2 combinations"},"evidence":[{"type":"📊","claim":"Post-completion prompts → ~80% acceptance rate (iOS \"Add to Contacts\" pattern)","source":"Apple HIG Research"},{"type":"🔍","claim":"SF4 NoticeToggle parasitic design — 4-case logic already defined","source":"SF4-thong-bao-cuoc/ANALYSIS.md"},{"type":"🏦","claim":"Vietcombank QR flow — post-result \"Lưu thụ hưởng?\" popup","source":"Competitive audit"}],"sim_notes":["Bottom sheet popup (drag indicator + close button)","hasNoticeToggle = server DV config boolean, not user action","NicknameInput pre-filled with NCC name from transaction","Skip = dismiss without saving → no data persistence"],"_domain":"payment"},"payment:M-23":{"id":"M-23","name":"SearchBar","shell":"ContactShell","slot":"ListContent","category":"🔁 SHARED (SF2)","phase":1,"states":2,"pattern":"Reuse search pattern","data_slot":"search-bar","sub_slots":["search-bar-input","search-bar-clear"],"mockup":"../domains/payment/mockups/M-23-SearchBar.png","context":null,"intent":null,"insight":null,"evidence":[],"sim_notes":[],"_domain":"payment"},"payment:M-24":{"id":"M-24","name":"EmptyState","shell":"ContactShell","slot":"ListContent","category":"🔁 SHARED (SF2)","phase":1,"states":1,"pattern":"Legacy alias → M-28","data_slot":"empty-state-legacy","sub_  trong InitShell.BillingFields — thay thế bill amount display khi lookup fail","principles":"#1 Trust First (explain error) + #4 State Completeness (no dead-ends)","value_pyramid":"Level 1 (Functional) → Level 2 (Usability) — prevents frustration by offering escape hatch"},"insight":{"title":"Graceful degradation > retry-only","description":"Hầu hết banking apps chỉ cung cấp \"Thử lại\" khi API fail. Insight: user đã biết số tiền từ bill giấy/email — manual entry là fallback tự nhiên nhưng không bank nào cung cấp. Đây là pattern \"app tôn trọng user knowledge\" — trust user nhập đúng thay vì block hoàn toàn.","core_pattern":"Graceful Degradation + Manual Fallback Path (progressive enhancement ngược)","behavioral":"Frustration escalation — mỗi lần \"Thử lại\" fail → frustration tăng gấp đôi. Manual entry thoát khỏi retry loop → reduces abandonment","differentiation":"Thông thường apps chỉ có Retry. Molecule này thêm \"Nhập thủ công?\" — tin tưởng user biết amount, không bắt phải phụ thuộc API","state_machine":"4 lookupStates × 2 hasManualFallback = 8 combinations"},"evidence":[{"type":"🔍","claim":"V2-10 AI Review: \"No offline/network error for bill lookup\"","source":"ai-review/bill-payment.md"},{"type":"📊","claim":"Error states chưa thiết kế — 71% modules affected (20/28)","source":"EXECUTIVE-SUMMARY §2"},{"type":"👤","claim":"\"Báo lỗi hệ thống nhưng không biết sai gì\"","source":"EXECUTIVE-SUMMARY §4 (user reviews)"},{"type":"🏦","claim":"Nubank offline mode — allows cached bill payment when API down","source":"Research §PT"}],"sim_notes":["4 lookupStates: idle → loading → error → success (lifecycle)","Manual entry fallback = same AmountInput (M-08) component, pre-filled if cached","BillLastUpdated (M-31) timestamp shows data freshness below amount","Builds on ErrorStateCard M-27 — adds domain-specific recovery path"],"_domain":"payment"},"payment:M-31":{"id":"M-31","name":"BillLastUpdated","shell":"ContactShell","slot":"ListContent","category":"🔁 SHARED (SF3)","phase":2,"states":2,"pattern":"Data freshness timestamp","data_slot":"bill-last-updated","sub_slots":["bill-last-updated-text"],"mockup":"../domains/payment/mockups/M-31-BillLastUpdated.png","context":null,"intent":null,"insight":null,"evidence":[],"sim_notes":[],"_domain":"payment"},"payment:M-32":{"id":"M-32","name":"QuickPayAmountField","shell":"InitShell","slot":"PaymentDetails","category":"⭐ ĐẶC THÙ (SF3)","phase":2,"states":2,"pattern":"Editable amount display","data_slot":"quickpay-amount","sub_slots":["quickpay-amount-field","quickpay-amount-edit"],"mockup":"../domains/payment/mockups/M-32-QuickPayAmountField.png","context":null,"intent":null,"insight":null,"evidence":[],"sim_notes":[],"_domain":"payment"},"transfer:M-01":{"id":"M-01","name":"AccountSelector","shell":"InitShell","slot":"SourceAccount","category":"🔁 SHARED (75% SFs)","phase":1,"states":6,"pattern":"Shared combobox","data_slot":"account-selector","sub_slots":["account-selector-trigger","account-selector-content","account-selector-item"],"mockup":"../domains/transfer/mockups/m01_accountselector.png","context":{"problem":"Người dùng Co-opBank thường sở hữu 2-5 tài khoản (thanh toán, tiết kiệm, thẻ) nhưng giao diện hiện tại không phân biệt rõ loại tài khoản và số dư khả dụng, dẫn đến chọn nhầm nguồn tiền.","trigger":"Audit 28 modules — 64% thiếu clear account identification (EXECUTIVE-SUMMARY §2)","problem_space":"User phải nhớ số TK 13 chữ số để xác định đúng tài khoản — cognitive load cao, đặc biệt với persona Bà Hoa (60+, thị giác yếu)","origin":"Competitive analysis — Toss/VCB hiện account card với badge loại TK + số dư real-time (gap 2.9 điểm). Internal audit — 6/8 SFs cần chọn TK nguồn","predecessor":"Không có — molecule nền tảng (foundation)"},"intent":{"quote":"Molecule này giúp người dùng mọi lứa tuổi chọn đúng tài khoản nguồn trong ≤2 taps khi bắt đầu bất kỳ giao dịch chuyển tiền nào.","primary_goal":"Giảm lỗi chọn nhầm TK nguồn xuống 0% thông qua visual differentiation","personas":"Bà Hoa (60+, cần badge lớn + số dư rõ) · Anh Tuấn (35-45, cần nhanh + chính xác)","context_of_use":"Entry point mọi SF — xuất hiện đầu tiên trên InitShell","principles":"#2 3-Tap Rule (chọn TK ≤ 2 taps) · #1 Trust First (số dư real-time tăng tin cậy)","value_pyramid":"Level 2 (Usability) — giảm friction cốt lõi"},"insight":{"title":"Badge-First Recognition","description":"Người dùng không nhớ số TK — họ nhớ loại tài khoản (\"cái TK lương\", \"cái thẻ Visa\"). Badge màu (TT/TK/Thẻ) kích hoạt pattern recognition nhanh hơn 3× so với đọc số.","core_pattern":"Account Card Pattern (Toss, Revolut) — compact card thay thế dropdown text-only","behavioral":"Recognition over Recall (Nielsen) — badge visual cho phép scan 2-5 TK trong <1s","differentiation":"App thông thường dùng dropdown text \"092xxxx - Thanh toán\". Molecule này dùng card với color-coded badge + số dư formatted, cho phép quyết định chọn TK dựa trên context (số dư đủ không?)","state_machine":"3 selectionState × 3 accountType = 9 combinations, pruned → 6 canonical"},"evidence":[{"type":"🔍","claim":"75% SFs (6/8) cần chọn TK nguồn — molecule reuse cao nhất","source":"molecules.md Group A"},{"type":"📊","claim":"Competitive gap 2.9/5 — 0/10 đối thủ dùng text-only dropdown cho account selection","source":"EXECUTIVE-SUMMARY §3"},{"type":"🏦","claim":"Toss Bank: account card + real-time balance → task success 95%+","source":"Competitive analysis"}],"sim_notes":["API: Fetch account list + real-time balance on mount","PII: Account number partial masking (hiện 4 số cuối) — toggle reveal","A11Y: Badge cần triple encoding (color + text + icon) per LV-08","State: Combobox popup cần scroll cho >5 accounts"],"_domain":"transfer"},"transfer:M-02":{"id":"M-02","name":"SourceAccountBlock","shell":"InitShell","slot":"SourceAccount","category":"⭐ SF8 only","phase":1,"states":2,"pattern":"Block wrapper","data_slot":"source-account-block","sub_slots":["reuse M-01 internal slots"],"mockup":"../domains/transfer/mockups/m02_sourceaccountblock.png","context":{"problem":"SF8 (Chuyển tiền định kỳ) cần visual hierarchy khác biệt so với các SF khác — M-01 đơn lẻ không đủ context để user nhận biết đây là flow đặt lịch.","trigger":"SF8 analysis — schedule flow cần block-based layout consistency","problem_space":"Without explicit block wrapper, user không phân biệt SF8 form sections với SF thường","origin":"Shell architecture — ScheduleListShell cần visual parity với InitShell sections","predecessor":"M-01 AccountSelector (reuse nguyên vẹn bên trong)"},"intent":{"quote":"Molecule này giúp người dùng đặt lịch nhận diện section \"Tài khoản nguồn\" trong context schedule khi thiết lập chuyển tiền định kỳ SF8.","primary_goal":"Visual consistency cho SF8 block-based layout","personas":"Anh Tuấn (35-45, dùng schedule cho lương) · Chị Mai (30-40, batch recurring)","context_of_use":"SF8 InitShell — thay thế M-01 standalone","principles":"#3 Clarity Over Features (section headers rõ ràng)","value_pyramid":"Level 2 (Usability) — structural clarity"},"insight":{"title":"Block Framing Effect","description":"Khi form dài (schedule có nhiều fields hơn SF thường), chia thành blocks có header giúp giảm perceived complexity 40%. User scan header → skip block nếu đã fill → focus block cần điền.","core_pattern":"Section Block (Material Design) — header + content + divider","behavioral":"Chunking (Miller) — chia form 15+ fields thành 4-5 blocks giảm cognitive load","differentiation":"Chỉ wrap thêm header + divider, KHÔNG duplicate M-01. Zero code duplication","state_machine":"2 blockStyle (default, highlighted khi schedule hint active)"},"evidence":[{"type":"🔍","claim":"SF8 form có 15+ fields — vượt cognitive load limit ELD-08 (68% fail)","source":"SCROLL-BUDGET.md §3"},{"type":"📐","claim":"Miller (1956) — chunking giảm cognitive load 40-60% cho forms >10 fields","source":"Cognitive Psychology"}],"sim_notes":["Compose: Wrap M-01, không render logic riêng","highlighted state: border glow khi schedule panel active","A11Y: BlockHea // RENDER
// ══════════════════════════════════════════════
function init() {
  renderStats(DATA.stats);
  renderTree(DATA.tree);
  document.getElementById('gen-date').textContent = DATA.generated;
  setupEvents();
}

function renderStats(s) {
  const statesPill = s.total_states ? `<div class="stat-pill"><strong>${s.total_states}</strong> states</div>` : '';
  const enrichedPill = s.enriched_modules ? `<div class="stat-pill" style="background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.15)"><strong>${s.enriched_modules}</strong> audited</div>` : '';
  
  // v5: Count actual screens from audited modules
  let actualScreensTotal = 0;
  for (const tab of DATA.tree.children) {
    for (const mod of (tab.children || [])) {
      for (const sf of (mod.children || [])) {
        if (sf.actual_screens && sf.actual_screens.length > 0) {
          actualScreensTotal += sf.actual_screens.length;
        }
      }
    }
  }
  const actualScreensPill = actualScreensTotal > 0 ? `<div class="stat-pill" style="background:rgba(16,185,129,0.06);border-color:rgba(16,185,129,0.12)"><strong>${actualScreensTotal}</strong> actual scr</div>` : '';
  
  document.getElementById('header-stats').innerHTML = `

function renderTree(tree) {
  const canvas = document.getElementById('canvas');
  
  // Root node
  const root = document.createElement('div');
  root.className = 'tree-root';
  root.innerHTML = `<div class="node-content"><span class="node-icon">${tree.icon || '🏦'}</span>${tree.name}</div>`;
  
  // Children (tabs)
  const ul = document.createElement('ul');
  ul.className = 'tree-children';
  
  for (const tab of tree.children) {
    ul.appendChild(renderTab(tab));
  }
  
  root.appendChild(ul);
  canvas.appendChild(root);
}

function renderTab(tab) {
  const li = document.createElement('li');
  li.className = 'tree-item node-tab';
  li.dataset.name = tab.name.toLowerCase();
  
  const stats = tab.stats || {};
  
  li.innerHTML = `
    <div class="node-content">
      <span class="node-icon">${tab.icon || '📂'}</span>
      <span>${tab.name}</span>
      <span class="node-badge">${stats.modules || 0} mod · ${stats.screens || 0} scr</span>
      ${chevronSVG}
    </div>
  `;
  
  // Module children
  if (tab.children && tab.children.length > 0) {
    const ul = document.createElement('ul');
    ul.className = 'tree-children';
    for (const mod of tab.children) {
      ul.appendChild(renderModule(mod));
    }
    li.appendChild(ul);
  }
  
  // Toggle
  li.querySelector('.node-content').addEventListener('click', (e) => {
    e.stopPropagation();
    li.classList.toggle('collapsed');
  });
  
  return li;
}

function renderModule(mod) {
  const li = document.createElement('li');
  const cat = mod.category || 'core';
  li.className = `tree-item node-module cat-${cat}`;
  li.dataset.name = mod.name.toLowerCase();
  li.dataset.id = mod.id || '';
  
  const stats = mod.stats || {};
  const moduleId = mapModuleToChecklistKey(mod.name);
  const hasChecklist = moduleHasChecklist(moduleId);
  
  if (hasChecklist) li.classList.add('has-checklist');
  
  // Aggregate checklist badge for this module
  let modClBadge = '';
  if (hasChecklist) {
    modClBadge = `<span class="mod-checklist-badge" data-module-id="${moduleId}" title="Xem Design Checklist">📋 Checklist</span>`;
  }
  
  const desc = mod.description || '';
  const enriched = mod.enriched ? `<span class="mod-enriched">✓ AUDITED</span>` : '';
  const statesTotal = mod.total_states ? `<span class="mod-states-total" title="Tổng states">🔴 ~${mod.total_states} states</span>` : '';
  li.innerHTML = `
    <div class="node-content">
      <div class="mod-icon cat-${cat}">${mod.icon || '📦'}</div>
      <div class="mod-label">
        <span class="mod-name">${mod.name} ${enriched}</span>

          <span>⚡ ${stats.features || 0}</span>
          ${statesTotal}
        </span>
      </div>
      ${modClBadge}
      ${chevronSVG}
    </div>
  `;
  
  // Sub-function children
  if (mod.children && mod.children.length > 0) {
    const ul = document.createElement('ul');
    ul.className = 'tree-children';
    for (const sf of mod.children) {
      ul.appendChild(renderSubFunction(sf, cat, moduleId));
    }

  li.querySelector('.node-content').addEventListener('click', (e) => {
    e.stopPropagation();
    li.classList.toggle('collapsed');
  });
  
  return li;
}

function renderSubFunction(sf, cat, moduleId) {
  const li = document.createElement('li');
  li.className = 'tree-item node-sf collapsed';
  li.dataset.name = sf.name.toLowerCase();
  
  const catColor = CATEGORY_COLORS[cat] || CATEGORY_COLORS.core;
  // v5: prefer actual_screens (from domain analysis) over URD screens
  const actualScreens = sf.actual_screens || [];
  const urdScreens = sf.screens || [];
  const displayScreens = actualScreens.length > 0 ? actualScreens : urdScreens;
  const hasScreens = displayScreens.length > 0;
  const isAudited = actualScreens.length > 0;
  const hasChecklist = moduleHasChecklist(moduleId);
  
  if (hasChecklist && hasScreens) li.classList.add('has-checklist');
  
  // SubFunc checklist badge
  let sfClBadge = '';
  if (hasChecklist && hasScreens) {
    sfClBadge = `<span class="sf-checklist-badge" data-module-id="${moduleId}" title="Xem Design Checklist">📋</span>`;
  }
  
  const sfDesc = sf.description || '';
  // v5: states & complexity
  const stateCount = sf.states || 0;
  const stateClass = stateCount > 50 ? 'high' : stateCount > 20 ? 'med' : 'low';
  const statesBadge = stateCount > 0 ? `<span class="sf-states ${stateClass}">${stateCount} st</span>` : '';
  const complexity = sf.complexity || 0;
  const complexityStars = complexity > 0 ? `<span class="sf-complexity">${'★'.repeat(Math.min(complexity,5))}</span>` : '';
  const screenType = sf.screen_type || '';
  const screenTypeBadge = screenType ? `<span class="screen-type">${screenType}</span>` : '';
  li.innerHTML = `
    <div class="node-content">
      <div class="sf-dot" style="background:${catColor}"></div>
      <div class="sf-info">
        <span class="sf-name">${sf.name}</span>
        ${sfDesc ? `<span class="sf-desc">${sfDesc}</span>` : ''}
      </div>
      <span class="sf-badge">${sf.screen_count} scr</span>
      ${statesBadge}
      ${complexityStars}
      ${screenTypeBadge}
      ${sfClBadge}
      ${hasScreens ? chevronSVG : ''}
    </div>
  `;
  
  // Screen children (Level 4)
  if (hasScreens) {
    const ul = document.createElement('ul');
    ul.className = 'tree-children';
    const seen = new Set();
    for (const scr of displayScreens) {
      const key = scr.id || scr.name;
      if (seen.has(key)) continue;
      seen.add(key);
      if (isAudited) {
        ul.appendChild(renderActualScreen(scr, moduleId));
      } else {
        ul.appendChild(renderScreen(scr, moduleId));
      }
    }
    li.appendChild(ul);
    
    // Toggle
    li.querySelector('.node-content').addEventListener('click', (e) => {
      e.stopPropagation();
      li.classList.toggle('collapsed');
    });
  }
  
  return li;
}

function mapModuleToChecklistKey(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('trang ch') || n.includes('home')) return 'HOME';
  if (n.includes('chuyển tiền') || n.includes('chuyen tien') || n.includes('transfer')) return 'TRANSFER';
  if (n.includes('thanh toán hóa đơn') || n.includes('thanh toan hoa don') || n.includes('bill payment')) return 'PAYMENT';
  if (n.includes('tiết kiệm') || n.includes('tiet kiem') || n.includes('saving')) return 'SAVINGS';
  if (n.includes('thẻ') || n.includes('the') || n.includes('card')) return 'CARD';
  if (n.includes('qr') || n.includes('quét mã')) return 'QR';
  if (n.includes('đăng nhập') || n.includes('dang nhap') || n.includes('login') || n.includes('onboard')) return 'LOGIN';
  return '_default';
}

// v5: Render actual screen (from domain SCREEN-MODEL.md analysis)
function renderActualScreen(scr, moduleId) {
  const li = document.createElement('li');
  li.className = 'tree-item node-screen node-actual-screen';
  li.dataset.name = scr.name.toLowerCase();
  
  const typeColor = SCREEN_TYPE_COLORS[scr.type] || { bg: 'rgba(0,0,0,0.04)', text: 'var(--text-muted)' };
  const mhBadge = scr.mh ? `<span class="screen-mh">${scr.mh}</span>` : '';
  const typeBadge = scr.type ? `<span class="screen-depth" style="background:${typeColor.bg};color:${typeColor.text}">${scr.type}</span>` : '';
  const statesBadge = scr.states ? `<span class="actual-screen-states">${scr.states}</span>` : '';
  const idBadge = scr.id ? `<span class="actual-screen-id">${scr.id}</span>` : '';
  
  // Per-screen checklist (priority) → fallback to module checklist
  const hasScreenCL = scr.id && screenHasChecklist(scr.id);
  const hasModuleCL = moduleHasChecklist(moduleId);
  let clBadge = '';
  if (hasScreenCL) {
    const count = getScreenChecklistCount(scr.id);
    clBadge = `<span class="screen-cl-badge" data-screen-id="${scr.id}" title="${count} checklist items">📋 ${count}</span>`;
  } else if (hasModuleCL) {
    clBadge = `<span class="checklist-badge" data-module-id="${moduleId || ''}" title="Design Checklist">📋</span>`;
  }

   // v8: Molecule badge
   const hasMols = scr.id && typeof MOLECULE_SCREEN_MAP !== 'undefined' && MOLECULE_SCREEN_MAP[scr.id] && MOLECULE_SCREEN_MAP[scr.id].molecules;
   const molCount = hasMols ? MOLECULE_SCREEN_MAP[scr.id].molecules.length : 0;
   const molBadge = molCount > 0 
     ? `<span class="screen-mol-badge" data-screen-id="${scr.id}" title="${molCount} molecules">🧬 ${molCount}</span>`
     : '';
  
  li.innerHTML = `
    <div class="node-content" title="${scr.desc || scr.name}">
      <span class="screen-icon">◻</span>
      <span class="screen-name">${scr.name}</span>
      ${mhBadge}
      ${statesBadge}
      ${typeBadge}
      ${clBadge}
      ${molBadge}
    </div>
  `;
  
  li.querySelector('.node-content').addEventListener('click', (e) => {
    if (e.target.closest('.screen-cl-badge') || e.target.closest('.checklist-badge') || e.target.closest('.screen-mol-badge')) return;
    openActualScreenInfo(scr);
  });
  
  // Per-screen checklist click
  if (hasScreenCL) {
    const clEl = li.querySelector('.screen-cl-badge');
    if (clEl) clEl.addEventListener('click', (e) => { e.stopPropagation(); openScreenChecklist(scr.id); });
  } else if (hasModuleCL) {
    const clEl = li.querySelector('.checklist-badge');
    if (clEl) clEl.addEventListener('click', (e) => { e.stopPropagation(); openChecklist(moduleId); });
  }
  

   // v8: Molecule badge click → open on Suggest Component tab
   if (molCount > 0) {
     const molEl = li.querySelector('.screen-mol-badge');
     if (molEl) molEl.addEventListener('click', (e) => { e.stopPropagation(); openScreenChecklist(scr.id, 'molecules'); });
   }

  return li;
}

function setupEvents() {
  // Expand all
  document.getElementById('btn-expand').addEventListener('click', function() {
    document.querySelectorAll('.node-tab, .node-module, .node-sf').forEach(n => n.classList.remove('collapsed'));
    setActiveBtn(this);
  });
  
  // Collapse all
  document.getElementById('btn-collapse').addEventListener('click', function() {
    document.querySelectorAll('.node-tab, .node-module, .node-sf').forEach(n => n.classList.add('collapsed'));
    setActiveBtn(this);
  });
  
  // Modules only (show modules, hide sub-functions)
  document.getElementById('btn-modules-only').addEventListener('click', function() {
    document.querySelectorAll('.node-tab').forEach(n => n.classList.remove('collapsed'));
    document.querySelectorAll('.node-module, .node-sf').forEach(n => n.classList.add('collapsed'));
    setActiveBtn(this);
  });
  
  // Search
  const searchInput = document.getElementById('search-input');
  let debounce;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => doSearch(searchInput.value.trim()), 150);
  });
}

function setActiveBtn(btn) {
  document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function doSearch(query) {
  const q = query.toLowerCase();
  
  // Remove previous highlights
  document.querySelectorAll('.highlight').forEach(el => {
    el.replaceWith(el.textContent);
  });
  
  if (!q) {
    document.querySelectorAll('.search-hidden').forEach(el => el.classList.remove('search-hidden'));
    document.querySelectorAll('.node-tab, .node-module').forEach(n => n.classList.remove('collapsed'));
    document.querySelectorAll('.node-sf').forEach(n => n.classList.add('collapsed'));
    return;
  }
  
  // Check each module and sub-function for matches
  const allModules = document.querySelectorAll('.node-module');
  const allTabs = document.querySelectorAll('.node-tab');
  
  // First: mark all tabs as hidden
  allTabs.forEach(t => t.classList.add('search-hidden'));
  
  allModules.forEach(mod => {
    const modName = mod.dataset.name || '';
    const sfs = mod.querySelectorAll('.node-sf');
    let modMatch = modName.includes(q);
    let anyChildMatch = false;
    
    sfs.forEach(sf => {
      const sfName = sf.dataset.name || '';
      if (sfName.includes(q)) {
        anyChildMatch = true;
        sf.classList.remove('search-hidden');
        // Highlight
        highlightText(sf.querySelector('.node-content span:not(.sf-dot):not(.sf-badge)'), q);
      } else if (modMatch) {
        sf.classList.remove('search-hidden');
      } else {
        sf.classList.add('search-hidden');
      }
    });
    
    if (modMatch || anyChildMatch) {
      mod.classList.remove('search-hidden');
      mod.classList.remove('collapsed');
      // Show parent tab
      const parentTab = mod.closest('.node-tab');
      if (parentTab) {
        parentTab.classList.remove('search-hidden');
        parentTab.classList.remove('collapsed');
      }
      if (modMatch) {
        highlightText(mod.querySelector('.mod-name'), q);
      }
    } else {
      mod.classList.add('search-hidden');
    }
  });
}

function highlightText(el, q) {
  if (!el) return;
  const text = el.textContent;
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return;
  
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + q.length);
  const after = text.slice(idx + q.length);
  
  el.innerHTML = `${before}<mark class="highlight">${match}</mark>${after}`;
}

// LIGHTBOX — URD Markdown Viewer
// ══════════════════════════════════════════════
const URD_BASE = '../urd/';
let lbCache = {};

function openLightbox(scr) {
  const overlay = document.getElementById('lightbox-overlay');
  const title = document.getElementById('lb-title');
  const badges = document.getElementById('lb-badges');
  const body = document.getElementById('lb-body');
  
  title.textContent = scr.name;
  let badgeHTML = '';
  if (scr.mh_id) badgeHTML += `<span class="lb-badge">${scr.mh_id}</span>`;
  if (scr.feature_ref) badgeHTML += `<span class="lb-badge ref">§${scr.feature_ref}</span>`;
  badges.innerHTML = badgeHTML;
  
  body.innerHTML = '<div class="lb-loading">⏳ Đang tải tài liệu URD...</div>';
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  
  if (!scr.urd_file) {
    body.innerHTML = '<div class="lb-error">Không có tài liệu URD liên kết với màn hình này.</div>';
    return;
  }
  
  const filePath = URD_BASE + scr.urd_file;
  
  if (lbCache[filePath]) {
    renderMarkdown(body, lbCache[filePath], scr);
    return;
  }
  
  fetch(filePath)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      lbCache[filePath] = md;
      renderMarkdown(body, md, scr);
    })
    .catch(() => {
      body.innerHTML = `<div class="lb-error">
        Không thể tải file: <code>${scr.urd_file}</code><br>
        <small>File:// protocol có thể chặn fetch. Thử mở trực tiếp:</small>
        <a href="${filePath}" target="_blank">Mở ${scr.urd_file} ↗</a>
      </div>`;
    });
}

  UX:       { cls: 'cl-cat-ux',       icon: '✨', label: 'UX' },
  State:    { cls: 'cl-cat-state',    icon: '🔄', label: 'State' },
  Security: { cls: 'cl-cat-security', icon: '🛡️', label: 'Security' },
  Architecture: { cls: 'cl-cat-arch', icon: '🏗️', label: 'Architecture' },
};

// ── Per-Screen Checklist Opener ──
function openScreenChecklist(screenId, initialTab) {
  const overlay = document.getElementById('checklist-overlay');
  const title = document.getElementById('cl-title');
  const body = document.getElementById('cl-body');
  const molBody = document.getElementById('mol-body');
  const tabsBar = document.getElementById('screen-lb-tabs');
  const moduleTag = document.getElementById('cl-module-tag');
  
  const data = SCREEN_CHECKLISTS[screenId];
  const hasMols = typeof MOLECULE_SCREEN_MAP !== 'undefined' && MOLECULE_SCREEN_MAP[screenId] && MOLECULE_SCREEN_MAP[screenId].molecules && MOLECULE_SCREEN_MAP[screenId].molecules.length > 0;
  const showTabs = !!data || hasMols;
  tabsBar.style.display = showTabs ? 'flex' : 'none';

  // v8: Render molecule tab
  if (hasMols) { renderMoleculesTab(screenId); }
  else { molBody.innerHTML = '<div class="mol-empty">Chưa có molecule cho screen này.</div>'; }
  
  // v8: Pick initial tab
  const activeTab = initialTab === 'molecules' ? 'molecules' : 'checklist';
  switchScreenTab(activeTab, !!data, hasMols);

  if (!data) {
    title.textContent = '📋 Design Checklist';
    moduleTag.textContent = screenId;
    body.innerHTML = '<div class="cl-error">Không có checklist cho screen này.</div>';
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    return;
  }
  
  title.textContent = `📋 ${data.screen}`;
  moduleTag.textContent = screenId;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  
  // Calculate stats
  const stats = { total: data.items.length, critical: 0, major: 0, minor: 0, standard: 0, checked: 0 };
  const byCat = {};
  data.items.forEach(item => {
    stats[item.sev] = (stats[item.sev] || 0) + 1;
    if (item.checked) stats.checked++;
    if (!byCat[item.cat]) byCat[item.cat] = [];
    byCat[item.cat].push(item);
  });
  
  // Build HTML
  let html = '';
  
  // Meta info
  html += '<div class="cl-screen-meta">';
  html += `<span class="cl-meta-item">Module: <strong>${data.module}</strong></span>`;
  html += `<span class="cl-meta-item">SF: <strong>${data.sf}</strong></span>`;
  html += `<span class="cl-meta-item">Items: <strong>${stats.total}</strong></span>`;
  html += '</div>';
  
  // Stats pills
  html += '<div class="cl-stats-row">';
  for (const [sev, cfg] of Object.entries(SEV_CONFIG)) {
    const count = stats[sev] || 0;
    if (count > 0) {
      html += `<span class="cl-stat-pill" style="background:${cfg.bg};color:${cfg.color}"><span class="${cfg.dot}"></span> ${count} ${cfg.label}</span>`;
    }
  }
  html += '</div>';
  
  // Items grouped by category
  const catOrder = ['UI', 'UX', 'State', 'Security'];
  for (const cat of catOrder) {
    const items = byCat[cat];
    if (!items || items.length === 0) continue;
    const catCfg = CAT_CONFIG[cat] || { cls: '', icon: '📌', label: cat };
    
    html += `<div class="cl-cat-header" style="background:${cat === 'UI' ? 'rgba(59,130,246,0.06)' : cat === 'UX' ? 'rgba(16,185,129,0.06)' : cat === 'State' ? 'rgba(245,158,11,0.06)' : 'rgba(239,68,68,0.06)'}">`;
    html += `<span class="cl-cat-badge ${catCfg.cls}">${catCfg.label}</span>`;
    html += `<span style="font-size:0.65rem;color:var(--text-muted)">${items.length} items</span>`;
    html += '</div>';
    
    items.forEach(item => {
      const sevCfg = SEV_CONFIG[item.sev] || SEV_CONFIG.standard;
      const checkIcon = item.checked
        ? '<span class="cl-item-check" style="color:#059669">☑</span>'
        : '<span class="cl-item-check" style="color:#d1d5db">☐</span>';
      const textCls = item.checked ? ' checked' : '';
      
      html += '<div class="cl-item-row">';
      html += `<span class="${sevCfg.dot}"></span>`;
      html += checkIcon;
      html += `<span class="cl-item-text${textCls}"><span class="cl-item-id">${item.id}</span>${item.text}</span>`;
      html += `<span class="src-ref" title="Source: ${item.src}">${item.src}</span>`;
      html += '</div>';
    });
  }
  
  body.innerHTML = html;
}

// ── Legacy Module-Level Checklist Opener (fallback) ──
function openChecklist(moduleId) {
  const overlay = document.getElementById('checklist-overlay');
  const title = document.getElementById('cl-title');
  const body = document.getElementById('cl-body');
  const moduleTag = document.getElementById('cl-module-tag');
  
  title.textContent = '📋 Design Checklist';
  moduleTag.textContent = moduleId || 'General';
  body.innerHTML = '<div class="cl-loading">⏳ Đang tải checklist...</div>';
  
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  
  const filePath = CHECKLIST_FILES[moduleId];
  if (!filePath) {
    body.innerHTML = '<div class="cl-error">Không có design checklist cho module này.</div>';
    return;
  }
  
  function renderAndScroll(md) {
    body.innerHTML = renderChecklistMd(md, moduleId);
    const slug = MODULE_SECTION_MAP[moduleId];
    if (slug) {
      setTimeout(() => {
        const target = body.querySelector(`h2[id*="${slug}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }
  }
  
  if (clCache[filePath]) {
    renderAndScroll(clCache[filePath]);
    return;
  }
  
  fetch(filePath)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      clCache[filePath] = md;
      renderAndScroll(md);
    })
    .catch(() => {
      body.innerHTML = `<div class="cl-error">
        Không thể tải file: <code>${filePath}</code><br>
        <small>File:// protocol có thể chặn fetch. Thử mở trực tiếp:</small>
        <a href="${filePath}" target="_blank">Mở ${filePath} ↗</a>
      </div>`;
    });
}

function renderChecklistMd(md, moduleId) {
  // Enhanced markdown → HTML converter with severity dots + source refs
  // Step 1: Process checkbox lines with severity parsing
  const lines = md.split('\n');
  const processed = lines.map(line => {
    // Checked checkbox
    const checkedMatch = line.match(/^- \[x\] (.*)$/);
    if (checkedMatch) return styleSeverityLine(checkedMatch[1], true);
    
    // Unchecked checkbox
    const uncheckedMatch = line.match(/^- \[ \] (.*)$/);
    if (uncheckedMatch) return styleSeverityLine(uncheckedMatch[1], false);
    
    return line;
  });
  
  let html = processed.join('\n')
    .replace(/^### (.*$)/gm, '<h3>$1</h3>')
    .replace(/^## (.*$)/gm, (m, title) => {
      const slug = title.trim().replace(/[^a-zA-Z0-9\u00C0-\u024F]/g, '-').replace(/-+/g, '-');
      return `<h2 id="cl-section-${slug}">${title}</h2>`;
    })
    .replace(/^# (.*$)/gm, '<h1>$1</h1>')
    .replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>')
    .replace(/^---$/gm, '<hr>')
    .replace(/^- (.*$)/gm, '<li>$1</li>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/<!--.*?-->/g, '')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '\n');
  
  // Wrap consecutive li items in ul
  html = html.replace(/(<li>.*?<\/li>\s*)+/g, (match) => `<ul>${match}</ul>`);
  // Clean consecutive blockquotes
  html = html.replace(/<\/blockquote>\s*<blockquote>/g, '<br>');
  
  return html;
}

function styleSeverityLine(content, isChecked) {
  // Parse severity emoji at start: 🔴 🟠 🟡 ⬜
  let sevClass = '';
  let text = content;
  // Emoji are multi-byte — check first 2 chars then space
  const SEV_MAP = [
    ['\uD83D\uDD34', 'sev-critical'], // 🔴
    ['\uD83D\uDFE0', 'sev-major'],    // 🟠  
    ['\uD83D\uDFE1', 'sev-minor'],    // 🟡
    ['\u2B1C', 'sev-standard'],        // ⬜
  ];
  for (const [emoji, cls] of SEV_MAP) {
    if (text.startsWith(emoji + ' ')) {
      sevClass = cls;
      text = text.slice(emoji.length + 1).trim();
      break;
    }
  }
  
  // Extract source ref: backtick `ID` at end of line
  let srcRef = '';
  const srcMatch = text.match(/\s*`([A-Z][A-Z0-9-]+(?:-\d+)?)`\s*$/);
  if (srcMatch) {
    srcRef = `<span class="src-ref" title="Source: ${srcMatch[1]}">${srcMatch[1]}</span>`;
    text = text.slice(0, srcMatch.index).trim();
  }
  
  // Inline code in remaining text
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  const sevDot = sevClass ? `<span class="${sevClass}"></span>` : '';
  const checkIcon = isChecked
    ? '<span style="color:#059669;flex-shrink:0">☑</span>'
    : '<span style="color:#d1d5db;flex-shrink:0">☐</span>';
  const textStyle = isChecked ? 'color:#9ca3af;text-decoration:line-through' : '';
  
  return `<div style="display:flex;align-items:center;gap:4px;padding:3px 0">${sevDot}${checkIcon}<span style="flex:1;${textStyle}">${text}</span>${srcRef}</div>`;
}

function renderMarkdown(container, md, scr) {
  // Find section relevant to this screen's feature_ref
  let relevantMd = md;
  if (scr.feature_ref) {
    const re = new RegExp(`(#{1,3}\\s*${scr.feature_ref.replace('.', '\\.')}[.\\s].*)`, 'i');
    const match = md.match(re);
    if (match) {
      const startIdx = md.indexOf(match[0]);
      const headingLevel = match[0].match(/^#+/)[0].length;
      const endRe = new RegExp(`^#{1,${headingLevel}}\\s`, 'm');
      const rest = md.slice(startIdx + match[0].length);
      const endMatch = rest.match(endRe);
      if (endMatch) {
        relevantMd = md.slice(startIdx, startIdx + match[0].length + endMatch.index);
      } else {
        relevantMd = md.slice(startIdx);
      }
    }
  }
  
  // Limit to reasonable size (first 8000 chars of relevant section)
  if (relevantMd.length > 8000) {
    relevantMd = relevantMd.slice(0, 8000) + '\n\n---\n*... (nội dung còn lại bị cắt — mở file đầy đủ)*';
  }
  
  const normalized = normalizeConfluenceTables(relevantMd);
  const html = simpleMarkdown(normalized);
  container.innerHTML = `<div class="lb-prose">${html}</div>`;
}

// Normalize Confluence-exported tables: each cell is on its own line, separated by pipes
function normalizeConfluenceTables(md) {
  const lines = md.split('\n');
  const out = [];
  let i = 0;
  
  // Pattern: header line contains multiple known column names
  const headerRe = /^\s*\|\s*(TT\s*\|)?\s*(?:Hạng mục|Thao tác)\s*\|/;
  
  while (i < lines.length) {
    const trimmed = lines[i].trim();
    
    if (headerRe.test(trimmed)) {
      // === FOUND TABLE HEADER ===
      // Step 1: Parse header to count columns
      const headerLine = trimmed.endsWith('|') ? trimmed : trimmed + '|';
      const headerCells = headerLine.split('|').filter(c => c.trim() !== '');
      const colCount = headerCells.length;
      
      // Step 2: Collect ALL subsequent lines that are part of this table
      // into one flat string — stop at headings or next header
      let flatContent = '';
      i++;
      while (i < lines.length) {
        const lt = lines[i].trim();
        // Stop conditions: heading, separator, or new table header
        if (lt.startsWith('#') || lt.startsWith('---')) break;
        if (headerRe.test(lt)) break;
        // Empty line after non-pipe content signals table end
        if (lt === '' && flatContent.length > 0 && !flatContent.trimEnd().endsWith('|')) {
          // Could be cell gap — peek ahead to see if more pipe content follows
          let hasMoreTableContent = false;
          for (let peek = i + 1; peek < Math.min(i + 5, lines.length); peek++) {
            const peekLine = lines[peek].trim();
            if (peekLine.startsWith('|') || /^\d+\s*\|/.test(peekLine)) { hasMoreTableContent = true; break; }
            if (peekLine.startsWith('#') || headerRe.test(peekLine)) break;
          }
          if (!hasMoreTableContent) break;
        }
        if (lt !== '') {
          flatContent += ' ' + lt;
        }
        i++;
      }
      
      // Step 3: Split flat content by pipe delimiter
      flatContent = flatContent.trim();
      if (!flatContent) {
        // Empty table — just output header
        out.push('| ' + headerCells.join(' | ') + ' |');
        out.push('|' + ' --- |'.repeat(colCount));
        continue;
      }
      
      // Split by | and filter empty edges
      const allCells = flatContent.split('|').map(c => c.trim());
      // Remove leading/trailing empty entries from split
      while (allCells.length > 0 && allCells[0] === '') allCells.shift();
      while (allCells.length > 0 && allCells[allCells.length - 1] === '') allCells.pop();
      
      // Step 4: Chunk cells into rows of colCount
      out.push('| ' + headerCells.join(' | ') + ' |');
      out.push('|' + ' --- |'.repeat(colCount));
      
      for (let r = 0; r < allCells.length; r += colCount) {
        const rowCells = allCells.slice(r, r + colCount);
        // Pad if needed
        while (rowCells.length < colCount) rowCells.push('');
        // Truncate long cell content for readability
        const cleaned = rowCells.map(c => c.replace(/\s+/g, ' ').slice(0, 300));
        out.push('| ' + cleaned.join(' | ') + ' |');
      }
      out.push(''); // blank line after table
    } else {
      out.push(lines[i]);
      i++;
    }
  }
  
  return out.join('\n');
}

function simpleMarkdown(md) {
  let html = md
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Code blocks (fenced)
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => {
    return `<pre><code>${code.trim()}</code></pre>`;
  });
  
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // Headers (h6 → h1, process longest prefix first)
  html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  
  // Bold / italic
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  
  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  
  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');
  
  // Tables — robust: match header row + separator + body rows
  html = html.replace(/(\|.+\|\n)(\|[\s:*\-|]+\|\n)(((\|.+\|)\n?)+)/g, (match, headerRow, sepRow, bodyRows) => {
    const parseRow = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    const headers = parseRow(headerRow);
    const rows = bodyRows.trim().split('\n').filter(r => r.trim().startsWith('|')).map(parseRow);
    let table = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
    rows.forEach(r => { table += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'; });
    table += '</tbody></table>';
    return table;
  });
  
  // Unordered lists
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
  
  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  
  // Paragraphs (lines not already wrapped and not pipe-only lines)
  html = html.replace(/^(?!<[hupboltd]|<\/|\|)(.+)$/gm, (m, p) => {
    if (p.trim() === '' || p.trim() === '|') return '';
    return `<p>${p}</p>`;
  });
  
  // Clean up empty lines
  html = html.replace(/\n{3,}/g, '\n\n');
  
  return html;
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function switchScreenTab(tabName, hasChecklist, hasMols) {
  const clBody = document.getElementById('cl-body');
  const molBody = document.getElementById('mol-body');
  const tabCL = document.getElementById('tab-checklist');
  const tabMol = document.getElementById('tab-molecules');
  const panel = document.querySelector('.checklist-panel');
  
  tabCL.classList.toggle('active', tabName === 'checklist');
  tabMol.classList.toggle('active', tabName === 'molecules');
  clBody.style.display = tabName === 'checklist' ? '' : 'none';
  molBody.style.display = tabName === 'molecules' ? '' : 'none';
  
  if (panel) panel.classList.toggle('mol-expanded', tabName === 'molecules');
  
  if (hasChecklist !== undefined) tabCL.style.display = hasChecklist ? '' : 'none';
  if (hasMols !== undefined) tabMol.style.display = hasMols ? '' : 'none';
}

document.getElementById('tab-checklist').addEventListener('click', () => switchScreenTab('checklist'));
document.getElementById('tab-molecules').addEventListener('click', () => switchScreenTab('molecules'));

function renderFullCard(mol) {
  const ctx = mol.context || {};
  const intent = mol.intent || {};
  const insight = mol.insight || {};
  const evidence = mol.evidence || [];
  const sim = mol.sim_notes || [];
  const subSlots = (mol.sub_slots || []).join(' · ');
  
  let h = '<article class="mv-card">';
  
  // Header
  h += '<div class="mv-card-header">';
  h += '<div class="mv-card-id">' + esc(mol.id) + '</div>';
  h += '<div class="mv-card-name">' + esc(mol.name) + '</div>';
  h += '<div class="mv-card-tags">';
  h += '<span class="mv-tag"><span class="mv-tag-label">Shell</span> ' + esc(mol.shell) + '</span>';
  h += '<span class="mv-tag"><span class="mv-tag-label">Slot</span> ' + esc(mol.slot) + '</span>';
  h += '<span class="mv-tag"><span class="mv-tag-label">Cat</span> ' + esc(mol.category) + '</span>';
  h += '<span class="mv-tag" style="background:rgba(124,58,237,0.08);color:#7c3aed;border-color:rgba(124,58,237,0.2)"><span class="mv-tag-label">Phase</span> ' + (mol.phase||'') + '</span>';
  if (mol.states > 0) h += '<span class="mv-tag" style="background:rgba(99,102,241,0.06);color:#6366f1;border-color:rgba(99,102,241,0.15)"><span class="mv-tag-label">States</span> ' + mol.states + '</span>';
  h += '</div>';
  if (mol.data_slot) h += '<div class="mv-data-slot">data-slot="' + esc(mol.data_slot) + '"' + (subSlots ? ' \u2192 ' + esc(subSlots) : '') + '</div>';
  h += '</div>';
  
  // Mockup
  h += '<div class="mv-card-mockup">';
  if (mol.mockup) {
    h += '<img src="' + mol.mockup + '" alt="' + esc(mol.id + ' ' + mol.name) + '" loading="lazy" onerror="this.style.display=\'none\'">';
  } else {
    h += '<div class="mv-mockup-pending">\u23f3 Mockup pending</div>';
  }
  h += '</div>';
  
  // Body sections
  h += '<div class="mv-card-body">';
  
  // Section 1: Context
  if (ctx.problem) {
    h += '<div class="mv-section">';
    h += '<div class="mv-section-header"><span class="mv-section-num">1</span> B\u1ed1i c\u1ea3nh h\u00ecnh th\u00e0nh</div>';
    h += '<div class="mv-quote">' + esc(ctx.problem) + (ctx.trigger ? '<br><strong>Trigger:</strong> ' + esc(ctx.trigger) : '') + '</div>';
    h += '<ul class="mv-bullets">';
    if (ctx.problem_space) h += '<li><span class="label">Problem Space:</span> ' + esc(ctx.problem_space) + '</li>';
    if (ctx.origin) h += '<li><span class="label">Origin:</span> ' + esc(ctx.origin) + '</li>';
    if (ctx.predecessor) h += '<li><span class="label">Predecessor:</span> ' + esc(ctx.predecessor) + '</li>';
    h += '</ul></div>';
  }
  
  // Section 2: Intent
  if (intent.quote) {
    h += '<div class="mv-section">';
    h += '<div class="mv-section-header"><span class="mv-section-num">2</span> Design Intent</div>';
    h += '<div class="mv-quote">' + esc(intent.quote) + '</div>';
    h += '<ul class="mv-bullets">';
    if (intent.primary_goal) h += '<li><span class="label">Primary Goal:</span> ' + esc(intent.primary_goal) + '</li>';
    if (intent.personas) h += '<li><span class="label">Personas:</span> ' + esc(intent.personas) + '</li>';
    if (intent.context_of_use) h += '<li><span class="label">Context of Use:</span> ' + esc(intent.context_of_use) + '</li>';
    if (intent.principles) h += '<li><span class="label">Principles:</span> ' + esc(intent.principles) + '</li>';
    if (intent.value_pyramid) h += '<li><span class="label">Value Pyramid:</span> ' + esc(intent.value_pyramid) + '</li>';
    h += '</ul></div>';
  }
  
  // Section 3: Insight
  if (insight.core_pattern || insight.title) {
    h += '<div class="mv-section">';
    h += '<div class="mv-section-header"><span class="mv-section-num">3</span> Insight</div>';
    const insightText = insight.title ? ('<strong>' + esc(insight.title) + ':</strong> ' + esc(insight.description||'')) : esc(insight.core_pattern||'');
    h += '<div class="mv-quote">' + insightText + '</div>';
    h += '<ul class="mv-bullets">';
    if (insight.core_pattern) h += '<li><span class="label">Core Pattern:</span> ' + esc(insight.core_pattern) + '</li>';
    if (insight.behavioral) h += '<li><span class="label">Behavioral:</span> ' + esc(insight.behavioral) + '</li>';
    if (insight.differentiation) h += '<li><span class="label">Differentiation:</span> ' + esc(insight.differentiation) + '</li>';
    if (insight.state_machine) h += '<li><span class="label">State Machine:</span> ' + esc(insight.state_machine) + '</li>';
    h += '</ul></div>';
  }
  
  // Section 4: Evidence
  if (evidence.length) {
    h += '<div class="mv-section">';
    h += '<div class="mv-section-header"><span class="mv-section-num">4</span> D\u1eabn ch\u1ee9ng</div>';
    h += '<table class="mv-evidence-table"><thead><tr><th></th><th>D\u1eabn ch\u1ee9ng</th><th>Ngu\u1ed3n</th></tr></thead><tbody>';
    evidence.forEach(e => { h += '<tr><td class="mv-evidence-type">' + (e.type||'') + '</td><td>' + esc(e.claim) + '</td><td>' + esc(e.source) + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  
  // Simulation Notes
  if (sim.length) {
    h += '<div class="mv-section">';
    h += '<div class="mv-section-header" style="color:#10b981"><span class="mv-section-num" style="background:rgba(16,185,129,0.1);color:#10b981">T</span> Simulation Notes</div>';
    h += '<div class="mv-sim-notes"><ul>' + sim.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
    h += '</div>';
  }
  
  h += '</div></article>';
  return h;
}

function renderMoleculesTab(screenId) {
  const molBody = document.getElementById('mol-body');
  const screenData = MOLECULE_SCREEN_MAP[screenId];
  const molRefs = screenData ? screenData.molecules : null;
  
  if (!molRefs || molRefs.length === 0) {
    molBody.innerHTML = '<div class="mol-empty">Ch\u01b0a c\u00f3 molecule cho screen n\u00e0y.</div>';
    return;
  }
  
  let html = '';
  
  // Summary bar
  const resolvedMols = molRefs.map(ref => MOLECULE_FULL_DATA[ref.domain + ':' + ref.id]).filter(Boolean);
  const shellSet = new Set(resolvedMols.map(m => m.shell));
  html += '<div class="mol-summary-bar">';
  html += '<span class="mol-summary-count">' + molRefs.length + '</span>';
  html += '<span class="mol-summary-label"><strong>' + molRefs.length + ' molecule</strong> g\u1ee3i \u00fd cho screen n\u00e0y<br>' + shellSet.size + ' shell \u00b7 ' + screenId + '</span>';
  html += '</div>';
  
  // Render full cards from lookup
  molRefs.forEach(ref => {
    const lookupKey = ref.domain + ':' + ref.id;
    const mol = MOLECULE_FULL_DATA[lookupKey];
    if (mol) {
      html += renderFullCard(mol);
    } else {
      // Minimal fallback
      html += '<article class="mv-card"><div class="mv-card-header">';
      html += '<div class="mv-card-id">' + esc(ref.id) + '</div>';
      html += '<div class="mv-card-name">' + esc(ref.id) + '</div>';
      html += '</div></article>';
    }
  });
  
  molBody.innerHTML = html;
}

</script>
