<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧬 Molecule Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="dark"] {
      --bg: #0a0a0f; --surface: #12121a; --surface-2: #1a1a26; --surface-3: #22222e;
      --border: #2a2a3a; --border-row: rgba(42,42,58,0.5);
      --text: #e4e4ef; --text-dim: #8888a0; --text-muted: #555570;
      --accent: #818cf8; --accent-dim: rgba(129,140,248,0.15); --accent-border: rgba(129,140,248,0.25); --accent-hover: rgba(129,140,248,0.3);
      --green: #34d399; --green-dim: rgba(52,211,153,0.15);
      --amber: #fbbf24; --amber-dim: rgba(251,191,36,0.12);
      --red: #f87171; --red-dim: rgba(248,113,113,0.12);
      --blue: #60a5fa; --blue-dim: rgba(96,165,250,0.12);
      --pink: #f472b6; --hero-glow: rgba(129,140,248,0.08); --h1-from: #e4e4ef;
      --card-gradient: linear-gradient(90deg, var(--accent), var(--pink), var(--accent));
      --radius: 12px; --mono: 'JetBrains Mono', monospace; --sans: 'Inter', -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f8f7f4; --surface: #ffffff; --surface-2: #f0efe9; --surface-3: #e8e6df;
      --border: #d4d2cb; --border-row: rgba(0,0,0,0.06);
      --text: #1a1a2e; --text-dim: #4a4a60; --text-muted: #7a7a90;
      --accent: #5b5fc7; --accent-dim: rgba(91,95,199,0.1); --accent-border: rgba(91,95,199,0.25); --accent-hover: rgba(91,95,199,0.18);
      --green: #0f9d58; --green-dim: rgba(15,157,88,0.1);
      --amber: #d48806; --amber-dim: rgba(212,136,6,0.1);
      --red: #d93025; --red-dim: rgba(217,48,37,0.08);
      --blue: #1a73e8; --blue-dim: rgba(26,115,232,0.08);
      --pink: #c2185b; --hero-glow: rgba(91,95,199,0.06); --h1-from: #1a1a2e;
      --card-gradient: linear-gradient(90deg, var(--accent), var(--pink), var(--accent));
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--sans); background:var(--bg); color:var(--text); line-height:1.7; -webkit-font-smoothing:antialiased; }

    .hero { position:relative; padding:80px 40px 60px; overflow:hidden; border-bottom:1px solid var(--border); }
    .hero::before { content:''; position:absolute; top:-120px; right:-120px; width:500px; height:500px; background:radial-gradient(circle, var(--hero-glow) 0%, transparent 70%); pointer-events:none; }
    .hero-badge { display:inline-flex; align-items:center; gap:6px; padding:5px 14px; background:var(--accent-dim); border:1px solid var(--accent-border); border-radius:100px; font-size:12px; font-weight:600; color:var(--accent); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:20px; }
    .hero h1 { font-size:42px; font-weight:800; letter-spacing:-1.5px; line-height:1.15; margin-bottom:12px; background:linear-gradient(135deg, var(--h1-from) 30%, var(--accent) 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .hero-sub { font-size:16px; color:var(--text-dim); max-width:680px; }
    .hero-meta { display:flex; flex-wrap:wrap; gap:24px; margin-top:28px; }
    .hero-meta-item { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); }
    .hero-meta-item strong { color:var(--text-dim); font-weight:600; }

    .container { max-width:1080px; margin:0 auto; padding:0 40px; }
    .section { padding:56px 0; border-bottom:1px solid var(--border); }
    .section:last-child { border-bottom:none; }
    .section-title { font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent); margin-bottom:32px; display:flex; align-items:center; gap:10px; }
    .section-title::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--border), transparent); }

    .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:32px; }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .stat-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-muted); margin-bottom:8px; }
    .stat-value { font-size:32px; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg, var(--text) 50%, var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .stat-sub { font-size:12px; color:var(--text-dim); margin-top:4px; }

    table { width:100%; border-collapse:separate; border-spacing:0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; font-size:13px; }
    thead { background:var(--surface-2); }
    th { padding:12px 16px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); border-bottom:1px solid var(--border); }
    td { padding:12px 16px; border-bottom:1px solid var(--border-row); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:var(--surface-2); }
    .mol-name { font-weight:600; color:var(--text); }
    .phase-badge { display:inline-block; padding:2px 10px; border-radius:100px; font-size:11px; font-weight:600; }
    .phase-1 { background:var(--red-dim); color:var(--red); }
    .phase-2 { background:var(--amber-dim); color:var(--amber); }
    .phase-3 { background:var(--blue-dim); color:var(--blue); }

    .molecule-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:48px; transition:border-color 0.3s; }
    .molecule-card:hover { border-color:var(--accent-hover); }
    .molecule-header { padding:32px 36px 24px; border-bottom:1px solid var(--border); position:relative; }
    .molecule-header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--card-gradient); opacity:0.6; }
    .molecule-id { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent); letter-spacing:0.5px; margin-bottom:6px; }
    .molecule-name { font-size:28px; font-weight:700; letter-spacing:-0.5px; margin-bottom:14px; }
    .molecule-tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; background:var(--surface-3); border:1px solid var(--border); border-radius:6px; font-size:12px; color:var(--text-dim); font-family:var(--mono); }
    .tag-label { font-weight:600; color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
    .data-slot-line { margin-top:14px; padding:8px 14px; background:var(--accent-dim); border:1px solid var(--accent-border); border-radius:8px; font-family:var(--mono); font-size:12px; color:var(--accent); }

    .molecule-mockup { padding:24px 36px; border-bottom:1px solid var(--border); background:var(--surface-2); }
    .molecule-mockup img { width:100%; max-width:680px; border-radius:12px; border:1px solid var(--border); display:block; margin:0 auto; }
    .mockup-pending { padding:40px; text-align:center; color:var(--text-muted); font-style:italic; font-size:14px; }

    .molecule-body { padding:32px 36px; }
    .mol-section { margin-bottom:32px; }
    .mol-section:last-child { margin-bottom:0; }
    .mol-section-header { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border-row); display:flex; align-items:center; gap:8px; }
    .mol-section-num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; background:var(--accent-dim); color:var(--accent); border-radius:6px; font-size:11px; font-weight:700; font-family:var(--mono); }
    .mol-quote { padding:16px 20px; background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; font-size:14px; line-height:1.8; color:var(--text); margin-bottom:16px; }
    .mol-bullets { list-style:none; padding:0; }
    .mol-bullets li { padding:6px 0 6px 20px; position:relative; font-size:14px; line-height:1.7; }
    .mol-bullets li::before { content:''; position:absolute; left:0; top:14px; width:6px; height:6px; background:var(--accent); border-radius:2px; opacity:0.6; }
    .mol-bullets .label { font-weight:600; color:var(--text); }
    .evidence-type { font-size:16px; text-align:center; width:40px; }

    .sim-notes { padding:16px 20px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; font-size:13px; color:var(--text-dim); }
    .sim-notes ul { list-style:none; padding:0; }
    .sim-notes li { padding:4px 0 4px 18px; position:relative; }
    .sim-notes li::before { content:'→'; position:absolute; left:0; color:var(--accent); font-weight:600; }

    .qg-table th { text-align:center; font-size:10px; letter-spacing:0.6px; }
    .qg-table th:first-child { text-align:left; }
    .qg-table td { text-align:center; }
    .qg-table td:first-child { text-align:left; font-weight:600; }
    .qg-pass { color:var(--green); }
    .qg-pending { color:var(--amber); }

    .rollout { display:flex; flex-direction:column; gap:20px; }
    .rollout-phase { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; }
    .rollout-phase-title { font-size:14px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .rollout-item { display:flex; align-items:center; gap:12px; padding:6px 0; font-size:13px; color:var(--text-dim); }
    .rollout-item .mol-id { font-family:var(--mono); font-weight:600; color:var(--accent); min-width:40px; }
    .rollout-item .mol-label { font-weight:500; color:var(--text); }

    .toc { position:fixed; top:50%; right:24px; transform:translateY(-50%); z-index:100; display:flex; flex-direction:column; gap:4px; max-height:80vh; overflow-y:auto; }
    .toc a { display:block; width:32px; height:32px; line-height:32px; text-align:center; font-family:var(--mono); font-size:10px; font-weight:700; color:var(--text-muted); text-decoration:none; border-radius:8px; background:var(--surface); border:1px solid var(--border); transition:all 0.2s; }
    .toc a:hover, .toc a.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-hover); }

    .theme-toggle { position:fixed; top:20px; right:24px; z-index:200; width:44px; height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:20px; transition:all 0.3s; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
    .theme-toggle:hover { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-hover); transform:scale(1.08); }
    .theme-toggle .icon-sun, .theme-toggle .icon-moon { transition:opacity 0.3s, transform 0.3s; position:absolute; }
    [data-theme="dark"] .theme-toggle .icon-sun { opacity:1; transform:rotate(0deg); }
    [data-theme="dark"] .theme-toggle .icon-moon { opacity:0; transform:rotate(-90deg); }
    [data-theme="light"] .theme-toggle .icon-sun { opacity:0; transform:rotate(90deg); }
    [data-theme="light"] .theme-toggle .icon-moon { opacity:1; transform:rotate(0deg); }

    body, .hero, .molecule-card, .stat-card, table, .sim-notes, .toc a, .rollout-phase, .mol-quote, .data-slot-line, .tag, .theme-toggle, .footer {
      transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    }
    .footer { padding:40px; text-align:center; color:var(--text-muted); font-size:12px; border-top:1px solid var(--border); }
    .loading { text-align:center; padding:120px 40px; color:var(--text-dim); font-size:18px; }
    .loading .spinner { display:inline-block; width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .search-bar { margin-bottom:24px; }
    .search-bar input { width:100%; padding:12px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:14px; font-family:var(--sans); outline:none; transition:border-color 0.2s; }
    .search-bar input:focus { border-color:var(--accent); }
    .search-bar input::placeholder { color:var(--text-muted); }
    .filter-row { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
    .filter-btn { padding:6px 14px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .filter-btn:hover, .filter-btn.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-border); }
    @media (max-width:900px) {
      .hero { padding:40px 20px 30px; }
      .container { padding:0 20px; }
      .hero h1 { font-size:28px; }
      .molecule-header, .molecule-body, .molecule-mockup { padding-left:20px; padding-right:20px; }
      .toc { display:none; }
    }
  </style>
</head>
<body data-theme="dark">

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Switch theme">
  <span class="icon-sun">☀️</span>
  <span class="icon-moon">🌙</span>
</button>

<nav class="toc" id="toc" aria-label="Molecule navigation"></nav>

<header class="hero">
  <div class="container">
    <div class="hero-badge">🧬 Molecule Reference</div>
    <h1 id="heroTitle">Loading...</h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-meta" id="heroMeta"></div>
  </div>
</header>

<main class="container">
  <section class="section" id="statsSection">
    <div class="section-title">Tổng quan State Matrix</div>
    <div class="stat-row" id="statCards"></div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Tìm molecule... (tên, shell, slot, ID)"></div>
    <div class="filter-row" id="filterRow"></div>
    <table id="overviewTable">
      <thead><tr><th>ID</th><th>Molecule</th><th>Shell · Slot</th><th style="text-align:center">States</th><th>Phase</th><th>Pattern</th></tr></thead>
      <tbody id="overviewBody"></tbody>
    </table>
  </section>

  <section class="section" id="moleculesSection">
    <div class="section-title">Molecules</div>
    <div id="moleculeCards"></div>
  </section>

  <section class="section" id="qg">
    <div class="section-title" id="qgTitle">Quality Gates</div>
    <table class="qg-table">
      <thead><tr><th>ID</th><th>Bối cảnh</th><th>Intent</th><th>Insight</th><th>Evidence</th><th>Mockup</th></tr></thead>
      <tbody id="qgBody"></tbody>
    </table>
  </section>

  <section class="section">
    <div class="section-title">Phase Rollout</div>
    <div class="rollout" id="rolloutContainer"></div>
  </section>
</main>

<footer class="footer" id="footer"></footer>

<!-- Data layer: script tag works on file://, fetch works on HTTP -->
<script src="molecules-data.js"></script>

<script>
(function(){
  // Theme persistence
  const THEME_KEY = 'molecule-viewer-theme';
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) document.body.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', function(){
    const next = (document.body.getAttribute('data-theme')||'dark') === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
  });

  // Data source priority:
  // 1. window.__MOLECULE_DATA__ (loaded via <script src>, works on file://)
  // 2. fetch from JSON (works on HTTP server, supports ?data=custom.json)
  const params = new URLSearchParams(location.search);
  const dataFile = params.get('data') || 'molecules-data.json';

  (window.__MOLECULE_DATA__
    ? Promise.resolve(window.__MOLECULE_DATA__)
    : fetch(dataFile).then(r => { if(!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
  )
    .then(render)
    .catch(err => {
      document.getElementById('heroTitle').textContent = '❌ Failed to load data';
      document.getElementById('heroSub').textContent = `${dataFile}: ${err.message}`;
    });

  function render(data) {
    const m = data.meta;
    const mols = data.molecules;

    // Hero
    document.title = `🧬 ${m.domain_name} — Molecule Reference`;
    document.getElementById('heroTitle').textContent = m.domain_name;
    document.getElementById('heroSub').textContent = `${m.version} · ${m.total_molecules} molecules · ${m.total_states} canonical states · ${m.described_count} described`;
    document.getElementById('heroMeta').innerHTML = [
      `<div class="hero-meta-item"><strong>Version:</strong> ${m.version}</div>`,
      `<div class="hero-meta-item"><strong>Shells:</strong> ${m.shell_count}</div>`,
      `<div class="hero-meta-item"><strong>Date:</strong> ${m.date}</div>`,
      `<div class="hero-meta-item"><strong>Molecules:</strong> ${m.total_molecules} (${m.described_count} described)</div>`,
    ].join('');

    // Stats
    document.getElementById('statCards').innerHTML = [
      statCard('Total Molecules', m.total_molecules, `across ${m.shell_count} shells`),
      statCard('Canonical States', m.total_states, 'post-pruning'),
      statCard('Complex (≥5)', m.complex_count, m.complex_ids),
      statCard('Cross-domain', m.cross_domain_count, m.cross_domain_ids),
    ].join('');

    // Shell filters
    const shells = [...new Set(mols.map(x => x.shell))];
    const phases = [...new Set(mols.map(x => x.phase))].sort();
    document.getElementById('filterRow').innerHTML =
      `<button class="filter-btn active" data-filter="all">All (${mols.length})</button>` +
      shells.map(s => `<button class="filter-btn" data-filter="shell:${s}">${s} (${mols.filter(x=>x.shell===s).length})</button>`).join('') +
      phases.map(p => `<button class="filter-btn" data-filter="phase:${p}">Phase ${p} (${mols.filter(x=>x.phase===p).length})</button>`).join('');

    // Overview table
    const tbody = document.getElementById('overviewBody');
    tbody.innerHTML = mols.map(mol => `<tr data-id="${mol.id}" data-shell="${mol.shell}" data-phase="${mol.phase}">
      <td><span style="font-family:var(--mono);color:var(--accent)">${mol.id}</span></td>
      <td class="mol-name">${mol.name}</td>
      <td>${mol.shell} · ${mol.slot}</td>
      <td style="text-align:center">${mol.states}</td>
      <td><span class="phase-badge phase-${mol.phase}">Phase ${mol.phase}</span></td>
      <td>${mol.pattern}</td>
    </tr>`).join('');

    // TOC
    document.getElementById('toc').innerHTML =
      mols.map(mol => `<a href="#${mol.id}" title="${mol.id} ${mol.name}">${mol.id.replace('M-','')}</a>`).join('') +
      `<a href="#qg" title="Quality Gates">QG</a>`;

    // Molecule cards
    document.getElementById('moleculeCards').innerHTML = mols.map(renderCard).join('');

    // Quality gates
    document.getElementById('qgTitle').textContent = `Quality Gate — ${mols.length}/${m.described_count} Pass`;
    document.getElementById('qgBody').innerHTML = mols.map(mol => {
      const e = mol.evidence || [];
      const eTypes = new Set(e.map(x=>x.type));
      const hasCtx = mol.context && mol.context.problem;
      const hasIntent = mol.intent && mol.intent.quote;
      const hasInsight = mol.insight && mol.insight.title;
      const hasEvidence = e.length >= 2 && eTypes.size >= 2;
      const hasMockup = !!mol.mockup;
      const p = (ok, txt) => ok ? `<td class="qg-pass">✅ ${txt}</td>` : `<td class="qg-pending">⏳</td>`;
      return `<tr>
        <td style="font-family:var(--mono);color:var(--accent)">${mol.id}</td>
        ${p(hasCtx, 'Problem')}${p(hasIntent, 'WHO+WHAT+WHEN')}${p(hasInsight, 'Non-obvious')}
        ${p(hasEvidence, `${e.length}src/${eTypes.size}types`)}
        ${p(hasMockup, 'Ready')}
      </tr>`;
    }).join('');

    // Phase rollout
    const phaseGroups = {};
    mols.forEach(mol => { (phaseGroups[mol.phase] = phaseGroups[mol.phase] || []).push(mol); });
    const phaseLabels = { 1: 'Core MVP — Critical path', 2: 'Enhanced UX — Batch + Schedule', 3: 'Delight — Identity + Smart UX' };
    document.getElementById('rolloutContainer').innerHTML = Object.keys(phaseGroups).sort().map(p => `
      <div class="rollout-phase">
        <div class="rollout-phase-title"><span class="phase-badge phase-${p}">Phase ${p}</span> ${phaseLabels[p]||''}</div>
        ${phaseGroups[p].map(mol => `<div class="rollout-item"><span class="mol-id">${mol.id}</span><span class="mol-label">${mol.name}</span></div>`).join('')}
      </div>
    `).join('');

    // Footer
    document.getElementById('footer').innerHTML = `<p>🧬 Co-opBank ${m.domain_id} Molecule Reference · ${m.version} · Generated ${m.date}</p>`;

    // Search + Filter
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', applyFilters);
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        applyFilters();
      });
    });

    function applyFilters() {
      const q = searchInput.value.toLowerCase();
      const filter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
      document.querySelectorAll('#overviewBody tr').forEach(tr => {
        const shell = tr.dataset.shell, phase = tr.dataset.phase;
        const text = tr.textContent.toLowerCase();
        let show = true;
        if (q && !text.includes(q)) show = false;
        if (filter !== 'all') {
          const [type, val] = filter.split(':');
          if (type === 'shell' && shell !== val) show = false;
          if (type === 'phase' && phase !== val) show = false;
        }
        tr.style.display = show ? '' : 'none';
      });
      document.querySelectorAll('.molecule-card').forEach(card => {
        const id = card.id, mol = mols.find(m => m.id === id);
        if (!mol) return;
        const text = `${mol.id} ${mol.name} ${mol.shell} ${mol.slot} ${mol.pattern}`.toLowerCase();
        let show = true;
        if (q && !text.includes(q)) show = false;
        if (filter !== 'all') {
          const [type, val] = filter.split(':');
          if (type === 'shell' && mol.shell !== val) show = false;
          if (type === 'phase' && String(mol.phase) !== val) show = false;
        }
        card.style.display = show ? '' : 'none';
      });
    }
  }

  function renderCard(mol) {
    const ctx = mol.context || {};
    const intent = mol.intent || {};
    const insight = mol.insight || {};
    const evidence = mol.evidence || [];
    const sim = mol.sim_notes || [];
    const subSlots = (mol.sub_slots || []).join(' · ');

    return `<article class="molecule-card" id="${mol.id}">
      <div class="molecule-header">
        <div class="molecule-id">${mol.id}</div>
        <h2 class="molecule-name">${mol.name}</h2>
        <div class="molecule-tags">
          <span class="tag"><span class="tag-label">Shell</span> ${mol.shell}</span>
          <span class="tag"><span class="tag-label">Slot</span> ${mol.slot}</span>
          <span class="tag"><span class="tag-label">Cat</span> ${mol.category}</span>
          <span class="tag phase-badge phase-${mol.phase}"><span class="tag-label">Phase</span> ${mol.phase}</span>
        </div>
        <div class="data-slot-line">data-slot="${mol.data_slot}"${subSlots ? ` → ${subSlots}` : ''}</div>
      </div>

      <div class="molecule-mockup">
        ${mol.mockup ? `<img src="${mol.mockup}" alt="${mol.id} ${mol.name}">` : `<div class="mockup-pending">⏳ Mockup pending — JSON prompt sẵn sàng</div>`}
      </div>

      <div class="molecule-body">
        ${ctx.problem ? `<div class="mol-section">
          <div class="mol-section-header"><span class="mol-section-num">1</span> Bối cảnh hình thành</div>
          <div class="mol-quote">${esc(ctx.problem)}${ctx.trigger ? `<br><strong>Trigger:</strong> ${esc(ctx.trigger)}` : ''}</div>
          <ul class="mol-bullets">
            ${ctx.problem_space ? `<li><span class="label">Problem Space:</span> ${esc(ctx.problem_space)}</li>` : ''}
            ${ctx.origin ? `<li><span class="label">Origin:</span> ${esc(ctx.origin)}</li>` : ''}
            ${ctx.predecessor ? `<li><span class="label">Predecessor:</span> ${esc(ctx.predecessor)}</li>` : ''}
          </ul>
        </div>` : ''}

        ${intent.quote ? `<div class="mol-section">
          <div class="mol-section-header"><span class="mol-section-num">2</span> Design Intent</div>
          <div class="mol-quote">${esc(intent.quote)}</div>
          <ul class="mol-bullets">
            ${intent.primary_goal ? `<li><span class="label">Primary Goal:</span> ${esc(intent.primary_goal)}</li>` : ''}
            ${intent.personas ? `<li><span class="label">Target Persona(s):</span> ${esc(intent.personas)}</li>` : ''}
            ${intent.context_of_use ? `<li><span class="label">Context of Use:</span> ${esc(intent.context_of_use)}</li>` : ''}
            ${intent.principles ? `<li><span class="label">Design Principle(s):</span> ${esc(intent.principles)}</li>` : ''}
            ${intent.value_pyramid ? `<li><span class="label">Value Pyramid:</span> ${esc(intent.value_pyramid)}</li>` : ''}
          </ul>
        </div>` : ''}

        ${insight.title ? `<div class="mol-section">
          <div class="mol-section-header"><span class="mol-section-num">3</span> Insight</div>
          <div class="mol-quote"><strong>${esc(insight.title)}:</strong> ${esc(insight.description||'')}</div>
          <ul class="mol-bullets">
            ${insight.core_pattern ? `<li><span class="label">Core Pattern:</span> ${esc(insight.core_pattern)}</li>` : ''}
            ${insight.behavioral ? `<li><span class="label">Behavioral Insight:</span> ${esc(insight.behavioral)}</li>` : ''}
            ${insight.differentiation ? `<li><span class="label">Differentiation:</span> ${esc(insight.differentiation)}</li>` : ''}
            ${insight.state_machine ? `<li><span class="label">State Machine:</span> ${esc(insight.state_machine)}</li>` : ''}
          </ul>
        </div>` : ''}

        ${evidence.length ? `<div class="mol-section">
          <div class="mol-section-header"><span class="mol-section-num">4</span> Dẫn chứng</div>
          <table class="evidence-table"><thead><tr><th>Loại</th><th>Dẫn chứng</th><th>Nguồn</th></tr></thead>
          <tbody>${evidence.map(e => `<tr><td class="evidence-type">${e.type}</td><td>${esc(e.claim)}</td><td>${esc(e.source)}</td></tr>`).join('')}</tbody></table>
        </div>` : ''}

        ${sim.length ? `<div class="mol-section">
          <div class="mol-section-header" style="color:var(--green)"><span class="mol-section-num" style="background:var(--green-dim);color:var(--green)">T</span> Simulation Notes</div>
          <div class="sim-notes"><ul>${sim.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
        </div>` : ''}
      </div>
    </article>`;
  }

  function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function statCard(label, value, sub) { return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`; }
})();
</script>
</body>
</html>
