name: Deploy MDviewer to GitHub Pages

on:
  push:
    branches: [MDviewer]
    paths:
      - 'tool/MDviewer/**'
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate manifest (files.json)
        working-directory: tool/MDviewer
        run: python3 generate-manifest.py --content MarkdownSV

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          cp tool/MDviewer/index.html _site/
          cp tool/MDviewer/files.json _site/
          # Copy markdown content files (flat, matching manifest paths)
          cp -r tool/MDviewer/MarkdownSV/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
