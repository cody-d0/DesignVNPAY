
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietnam Airlines · Booking Flow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background: #0c0c0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      padding: 48px 40px 64px;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    .page-header { text-align: center; margin-bottom: 48px; }
    .page-eyebrow {
      font-size: 11px; font-family: ui-monospace, Menlo, monospace;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); margin-bottom: 10px;
    }
    .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #fff; margin: 0 0 8px; }
    .page-sub   { font-size: 15px; color: rgba(255,255,255,0.4); margin: 0; }

    .flow-row { display: flex; align-items: flex-start; gap: 0; justify-content: center; }

    .phone-card { display: flex; flex-direction: column; align-items: center; }

    .clay-frame {
      width: 390px; height: 844px;
      border-radius: 50px;
      border: 12px solid #ededf0;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.12),
        0 2px 8px rgba(0,0,0,0.1),
        0 16px 48px -4px rgba(0,0,0,0.42),
        0 48px 96px -12px rgba(0,0,0,0.28);
      overflow: hidden; position: relative;
      background: #ededf0;
      zoom: 0.58;
    }
    .clay-frame::after {
      content: ''; position: absolute; inset: 0; border-radius: 38px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), inset 0 -1px 0 rgba(0,0,0,0.05);
      pointer-events: none;
    }
    .clay-frame iframe { width: 390px; height: 844px; border: 0; display: block; }

    .screen-label { margin-top: 14px; text-align: center; }
    .sl-step { font-size: 10px; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.28); margin-bottom: 3px; }
    .sl-name { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.68); letter-spacing: -0.01em; }

    .flow-arrow { display: flex; align-items: center; justify-content: center; width: 36px; padding-bottom: 56px; align-self: center; flex-shrink: 0; }
    .flow-arrow svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.18); fill: none; stroke-width: 1.5; }

    .spec-footer { margin-top: 48px; display: flex; gap: 36px; justify-content: center; flex-wrap: wrap; }
    .spec-item { text-align: center; }
    .spec-num { font-size: 22px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; color: oklch(60% 0.18 255); }
    .spec-label { font-size: 10px; color: rgba(255,255,255,0.28); font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.06em; margin-top: 2px; }

    @keyframes slide-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .phone-card { animation: slide-up 0.5s ease both; }
    .phone-card:nth-child(1) { animation-delay: 0.06s; }
    .phone-card:nth-child(3) { animation-delay: 0.12s; }
    .phone-card:nth-child(5) { animation-delay: 0.18s; }
    .phone-card:nth-child(7) { animation-delay: 0.24s; }
    .phone-card:nth-child(9) { animation-delay: 0.30s; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div class="page-eyebrow">SF1 · Booking Flow · 5 screens · Modern Minimal</div>
      <h1 class="page-title">Vietnam Airlines</h1>
      <p class="page-sub">Search → Results → Booking → Payment → Confirmation</p>
    </div>

    <div class="flow-row">
      <div class="phone-card">
        <div class="clay-frame">
          <iframe src="01-search.html" title="Search" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="screen-label"><div class="sl-step">01</div><div class="sl-name">Tìm chuyến bay</div></div>
      </div>
      <div class="flow-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
      <div class="phone-card">
        <div class="clay-frame">
          <iframe src="02-results.html" title="Results" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="screen-label"><div class="sl-step">02</div><div class="sl-name">Kết quả</div></div>
      </div>
      <div class="flow-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
      <div class="phone-card">
        <div class="clay-frame">
          <iframe src="03-booking.html" title="Booking" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="screen-label"><div class="sl-step">03</div><div class="sl-name">Xác nhận</div></div>
      </div>
      <div class="flow-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
      <div class="phone-card">
        <div class="clay-frame">
          <iframe src="04-payment.html" title="Payment" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="screen-label"><div class="sl-step">04</div><div class="sl-name">Thanh toán</div></div>
      </div>
      <div class="flow-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
      <div class="phone-card">
        <div class="clay-frame">
          <iframe src="05-confirmation.html" title="Confirmation" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="screen-label"><div class="sl-step">05</div><div class="sl-name">Đặt thành công</div></div>
      </div>
    </div>

    <div class="spec-footer">
      <div class="spec-item"><div class="spec-num">5</div><div class="spec-label">SCREENS</div></div>
      <div class="spec-item"><div class="spec-num">12</div><div class="spec-label">MOLECULES</div></div>
      <div class="spec-item"><div class="spec-num">25</div><div class="spec-label">DATA-SLOTS</div></div>
      <div class="spec-item"><div class="spec-num">4</div><div class="spec-label">SHELLS</div></div>
    </div>
  </div>
</body>
</html>
